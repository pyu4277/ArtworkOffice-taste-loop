<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 배치(반응형): 맨 위 메뉴 줄(고정) → 리본 → [왼쪽 사이드 트리 | 본문] → 아래 고정 이전/다음.
   사이드 트리는 640px 이상에서 옆으로 밀어 열리고(겹치지 않음), 그보다 좁으면 겹쳐 열린다. 닫으면 왼쪽 가장자리의 세로 손잡이만 남는다.
   트리: 1부 큰 구분 → 화면 → 차원 / 2부 취향 → P1~P5 → 하위 → 질문 / 3부 이번 자료 / 참고 서랍. 선으로 연결, 접기·펼치기·선택 펼치기.
   질문을 펼치면 예시 줄(글 스타일·화면 그림)이 나오고, 예시를 누르면 답이 된다. 「크게 보기」는 본문에 격자로 펼친다. */
:root{--bg:#f4f6f8;--fg:#1b2430;--muted:#5b6675;--panel:#ffffff;--line:#d6dce4;--shell:#e8edf2;--side:#f9fafc;--accent:#0f766e;--accent-soft:#e3f3ef;--good:#2e7d32;--bad:#c62828;--warn:#b26a00;--shadow:0 10px 28px rgba(16,24,32,.2);--bar:50px;--sidew:clamp(270px,32vw,340px);--font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--fg:#e6ebf2;--muted:#9aa6b5;--panel:#161c24;--line:#2a3441;--shell:#131a22;--side:#10161d;--accent:#2dd4bf;--accent-soft:#12302d;--good:#4ade80;--bad:#f87171;--warn:#fbbf24;--shadow:0 10px 28px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141a;--fg:#e6ebf2;--muted:#9aa6b5;--panel:#161c24;--line:#2a3441;--shell:#131a22;--side:#10161d;--accent:#2dd4bf;--accent-soft:#12302d;--good:#4ade80;--bad:#f87171;--warn:#fbbf24;--shadow:0 10px 28px rgba(0,0,0,.5);color-scheme:dark}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--shell)}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
h1{font-size:1.25rem;margin:0 0 6px;text-wrap:balance}
h2{font-size:1.15rem;margin:0 0 4px;text-wrap:balance}
h3{font-size:1rem;margin:0 0 6px}
a{color:var(--accent)}
.small{font-size:.85rem;color:var(--muted)}
.ok{color:var(--good)}.ng{color:var(--bad)}
/* 메뉴 줄·리본 */
.menubar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;min-height:var(--bar);box-sizing:border-box;display:flex;gap:6px;align-items:center;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));background:var(--shell);border-bottom:1px solid var(--line)}
.brand{flex:1 1 0;min-width:0;font-weight:700;font-size:1rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:500;font-size:.72rem;color:var(--muted)}
.menu{display:flex;gap:2px}
.mbtn{font:inherit;font-size:.92rem;min-height:38px;padding:4px 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--fg);cursor:pointer;white-space:nowrap}
.mbtn[aria-current="true"]{background:var(--panel);border-color:var(--line);font-weight:600}
.mtoggle{display:none}
.ribbon{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:thin}
.ribbon>*{flex:none}
.ribbon .sp{flex:1 1 0;min-width:0}
.rbtn,.chip{font:inherit;font-size:.9rem;min-height:38px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;white-space:nowrap}
.rbtn[aria-pressed="true"],.rbtn[aria-current="true"],.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.rbtn[disabled]{opacity:.5;cursor:default}
.rtxt{font-size:.85rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rin{font:inherit;font-size:.9rem;min-height:38px;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);width:220px;max-width:55vw;box-sizing:border-box}
/* 사이드 트리 + 본문 */
.shell{display:flex;align-items:flex-start}
.side{width:var(--sidew);flex:none;box-sizing:border-box;position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));max-height:calc(100vh - var(--bar) - env(safe-area-inset-top,0px));overflow-y:auto;overflow-x:hidden;background:var(--side);border-right:1px solid var(--line);padding:8px 8px 120px max(8px,env(safe-area-inset-left,0px))}
.side.closed{display:none}
.main{flex:1 1 0;min-width:0}
.wrap{max-width:720px;margin:0 auto;padding-block:12px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main.wide .wrap{max-width:1100px}
.sidetab{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:8;writing-mode:vertical-rl;font:inherit;font-size:.8rem;padding:10px 5px;border:1px solid var(--line);border-left:0;border-radius:0 10px 10px 0;background:var(--panel);color:var(--fg);cursor:pointer;box-shadow:var(--shadow);padding-left:calc(5px + env(safe-area-inset-left,0px))}
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.4);z-index:11}
@media (min-width:640px){.scrim{display:none}}
@media (max-width:639px){
  .side{position:fixed;left:0;top:0;bottom:0;max-height:none;width:min(88vw,360px);z-index:12;box-shadow:var(--shadow);padding-top:calc(env(safe-area-inset-top,0px) + 8px);border-right:0}
}
@media (max-width:899px){
  .menu{display:none;position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(100% + 4px);flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:var(--shadow);z-index:12}
  .menu.open{display:flex}
  .mtoggle{display:inline-flex}
}
.sidehead{display:flex;align-items:center;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.sidehead b{flex:1 1 100px;min-width:0;font-size:.95rem}
.sin{font:inherit;font-size:.9rem;width:100%;box-sizing:border-box;min-height:38px;padding:4px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
.tools{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.tbtn{font:inherit;font-size:.8rem;min-height:32px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;white-space:nowrap}
.tbtn[aria-expanded="true"],.tbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pop{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px;margin:4px 0 8px;font-size:.85rem;display:grid;gap:6px}
.pop label{display:flex;gap:6px;align-items:center;min-height:30px}
.pop .cols{display:flex;flex-wrap:wrap;gap:4px 12px}
/* 트리 */
.tn{position:relative}
.tr{position:relative;display:flex;align-items:center;gap:2px;min-height:34px;padding:2px 4px 2px 0;border-radius:6px;cursor:pointer}
.tr:hover{background:var(--accent-soft)}
.tr.cur{background:var(--accent-soft)}
.tr.cur .lb{font-weight:600}
.tr .tg{flex:none;width:26px;height:26px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.8rem;cursor:pointer;border-radius:6px;padding:0}
.tr .lb{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.tr.grp .lb{font-weight:600}
.tr .st{flex:none;font-size:.72rem;color:var(--muted);max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .st.on{color:var(--accent)}
.tr .n{flex:none;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:2px}
.tc{margin-left:12px;padding-left:10px;border-left:1px solid var(--line)}
.tc>.tn>.tr::before{content:"";position:absolute;left:-10px;top:50%;width:8px;height:1px;background:var(--line)}
.td{margin:0 0 8px 20px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:.85rem}
.td .cur{margin:0 0 6px;font-size:.85rem;padding:6px 8px}
.td .cur small{font-size:.76rem}
.td .acts{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 2px}

.grp{font-size:.78rem;color:var(--muted);margin:10px 0 4px;letter-spacing:.02em;text-transform:uppercase}
/* 예시 타일·화면 그림 */
.tiles{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;scrollbar-width:thin}
.tile{flex:none;width:136px;font:inherit;text-align:left;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:5px;cursor:pointer;display:grid;gap:4px;box-sizing:border-box}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tile .lb{font-size:.78rem;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.tile .ds{font-size:.74rem;color:var(--muted);line-height:1.3}
.tile.big{width:auto}
.tile.big .lb{font-size:.95rem}.tile.big .ds{font-size:.85rem}
.pv{border-radius:6px;overflow:hidden;background:var(--bg);min-height:40px}
.pv svg{display:block;width:100%;height:auto}
.pv.txt{padding:6px 8px;font-size:.78rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;background:var(--panel);border:1px dashed var(--line)}
.tile.big .pv.txt{font-size:.95rem;-webkit-line-clamp:12}
.pv.lbl{padding:8px;font-size:.8rem;color:var(--muted);text-align:center}
.guide{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:6px 10px;margin:6px 0 2px;background:var(--panel)}
.guide p{margin:0 0 2px}.guide ul{margin:0 0 4px;padding-left:18px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;align-items:start}
.hl{outline:3px solid var(--accent);outline-offset:2px}
@keyframes pv-move{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.pv .mv{animation:pv-move 1.2s ease-in-out infinite alternate}
.pv .mv.soft{animation-duration:2.4s}

/* 참고 카드 (끌 수 있음) */
.rc{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 2px;margin:0 0 8px;font-size:.88rem;line-height:1.4}
.rc.now{border-color:var(--accent)}
.rc.dragging{opacity:.45}
.rc .grip{flex:none;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;color:var(--muted);font-size:1.25rem;padding:0 5px;line-height:1.1}
.rc .body{flex:1 1 0;min-width:0;display:grid;gap:3px}
.rc p{margin:0;overflow-wrap:anywhere}
.rc .t{font-weight:600}
.rc .m{color:var(--muted);font-size:.78rem}
.rc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.rc .acts .chip,.rc .acts a.chip{min-height:32px;font-size:.82rem;padding:2px 10px;display:inline-flex;align-items:center;text-decoration:none}
.rc .more{font-size:.82rem;white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:4px;margin-top:2px}
.ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;max-width:260px;background:var(--panel);border:1.5px solid var(--accent);border-radius:10px;padding:6px 10px;font-size:.85rem;box-shadow:var(--shadow);transform:translate(-50%,-120%)}

.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.step{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:12px 0}
.card.over{outline:3px solid var(--accent);outline-offset:1px}
.card.base{border-style:dashed}
.reflinks{display:grid;gap:6px;margin:0 0 6px}
.reflink{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 8px;border:1px solid var(--line);border-radius:10px}
.reflink a{font-weight:600;color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.reflink .small{flex:1 1 220px;min-width:0}
.refitem{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0}

.refnote{margin:8px 0 0;padding:8px 10px;border-left:4px solid var(--warn);border-radius:0 8px 8px 0;font-size:.92rem}
.q{font-weight:600;margin:0 0 8px}
.hint{color:var(--muted);font-size:.9rem;margin:-4px 0 8px}
.card.sub{margin-left:18px;border-left:4px solid var(--accent)}
textarea.opinion{width:100%;box-sizing:border-box;margin-top:8px;min-height:44px}
/* 선택지 예시 카드 */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}

.dcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.dcard.prim{box-shadow:0 0 0 2px var(--accent),0 0 0 5px var(--accent-soft)}
.dname{font-weight:700}
iframe.demo{width:100%;aspect-ratio:16/10;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:block}
.dver{font-size:.8rem;color:var(--muted)}.dver b{color:var(--fg)}

.dafter div{background:var(--panel);border-radius:8px;padding:6px 8px}.dafter b{display:block;font-size:.75rem;color:var(--muted)}
.dhist{font-size:.8rem}.dhist summary{cursor:pointer;color:var(--accent)}.dhist ul{margin:4px 0;padding-left:18px;color:var(--muted)}
.dpick{align-self:stretch;text-align:center;font-weight:700}
.drest{margin-top:10px}
.dsec{margin:8px 0}

/* 사이드 트리: 지금 보는 자리 */
.tr.here{background:var(--accent-soft);border-radius:8px;box-shadow:0 0 0 1px var(--accent),0 0 12px var(--accent);animation:herepulse 2.4s ease-in-out infinite}
.tr.here .lb{color:var(--accent);font-weight:800}
.tr.here-in>.lb{color:var(--accent)}
.herechip{font-size:.7rem;font-weight:800;color:var(--bg);background:var(--accent);border-radius:999px;padding:0 7px;margin-left:6px;flex:none}
@keyframes herepulse{50%{box-shadow:0 0 0 1px var(--accent),0 0 22px var(--accent)}}
@media (prefers-reduced-motion:reduce){.tr.here{animation:none}}
@media (max-width:639px){.dafter{grid-template-columns:1fr}}
.ogrp{flex-basis:100%;font-size:.8rem;font-weight:700;color:var(--muted);margin:6px 0 -2px}
.hint.cond{color:var(--accent);font-weight:600}
@media (max-width:639px){.card.sub{margin-left:8px}}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-size:1rem;min-height:46px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;text-align:left;max-width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}

.opt:focus-visible,.btn:focus-visible,.chip:focus-visible,.rbtn:focus-visible,.mbtn:focus-visible,.tbtn:focus-visible,.tile:focus-visible,.tr .tg:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea,input[type=text],input[type=url],select{font:inherit;width:100%;box-sizing:border-box;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);min-height:44px}
textarea{min-height:76px;resize:vertical}
.badge{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--fg);margin-right:4px;vertical-align:middle}
.badge.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}

.cur{margin:6px 0 10px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:.98rem}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.btn{font:inherit;font-size:1rem;min-height:46px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}

.btn[disabled]{opacity:.5;cursor:default}
.btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}

.rchip{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:2px 2px 2px 9px;color:var(--fg);font-size:.82rem;max-width:100%;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

function renderHelp(root) {

<p><b>${esc(MODE_NAME)}</b> 화면은 아래 「이전·다음」(키보드 ←/→)으로 넘깁니다. 답은 이 기기에만 임시 저장되고, 마지막 화면의 「저장·제출」로 Claude에게 보냅니다. 파일로 열었다면 「JSON 내려받기」로 저장해 <code>materials/인터뷰/</code>에 두거나 「복사」해 대화에 붙여 넣습니다.</p>
<p><b>사이드 트리(☰ 트리)</b>: 1부 큰 구분 → 화면 → 차원 / 2부 취향 → 묶음 → 하위 → 질문 / 3부 이번 자료 / 참고 서랍(지난 프로젝트·지난 답·취향 항목·교훈·실수·디자인 레퍼런스·템플릿·새 메모). 넓은 화면에서는 옆으로 밀어 열리고, 좁은 화면에서는 겹쳐 열립니다. 닫으면 왼쪽 가장자리의 「트리 열기」 손잡이로 다시 엽니다.</p>
<p><b>접기·펼치기</b>: ▾/▸로 하나씩, 「모두 접기」「모두 펼치기」로 한 번에, 「선택 펼치기 ▾」로 묶음과 조건(전부 / 답 안 한 항목만 / 학습된 값이 있는 항목만 / 지금 화면만)을 골라 한 번에 펼칩니다. 열림 상태는 기억됩니다.</p>

<p><b>카드를 답에 넣는 법</b>: 카드 왼쪽 손잡이(⠿)를 끌어 질문 카드 위에 놓거나(마우스는 카드 아무 곳이나), 카드의 「넣기 ▸」를 눌러 넣을 질문을 고릅니다. 같은 항목의 취향·지난 답을 넣으면 답도 그 값으로 맞춰지고, 다른 참고는 그 질문의 「참고」 칸에 붙습니다(✕로 빼기).</p>
<p><b>기본 양식</b>: 지난 프로젝트 카드의 「이 양식으로 시작」 또는 첫 화면의 「기본 양식」 칸에 놓기 → 그 프로젝트의 차원 값·적용 취향이 한 번에 채워집니다. 제출 JSON의 <code>base_project</code>를 Claude는 「이 양식을 기본 설정으로 원한다」로 읽습니다.</p>
<p><b>선택별 진화 기록</b>: 예시 타일의 「방법 v1」은 그 선택을 고르면 지금 어떻게 만드는지(방법·점검·예시·배운 프로젝트·이력)가 기록돼 있다는 뜻입니다. 질문을 펼치거나 크게 보기에서 고른 선택의 방법이 보입니다. 프로젝트를 마무리할 때 방법이 나아지면 버전이 오르므로, 같은 선택을 또 골라도 다음 자료는 새 방법으로 만들어집니다. 저장소 → 「선택 기록」에서 전부 볼 수 있습니다.</p>
<p><b>고른 것에 따라 바뀌는 질문</b>: 위에서 고른 답에 따라 다음 목차·질문·선택지가 나타나거나 숨습니다(예: 파일 형식에 HTML을 고르면 「HTML 화면 구성」 목차가 생기고, 방향을 고르면 그 방향에 맞는 크기만 보입니다). 「↳ … 골라서 나온 질문」 카드는 위 답에서 이어진 질문입니다. 숨은 질문의 답은 제출에서 빠지고, 다시 고르면 되살아납니다. 목차·질문·선택지 자체를 고치려면 구조 편집 페이지(<code>--mode edit</code>)를 씁니다.</p>
<p><b>새 레퍼런스</b>: 참고 서랍 「새 메모」에 적으면 <code>new_refs</code>로 전해지고, 작업이 끝나면 다음 인터뷰부터 카드로 쌓입니다. 지난 프로젝트의 실제 결과물은 게시 URL 링크(새 탭)와 PC 경로로 보여 줍니다.</p>
<p><b>기타 의견</b>: 질문마다 선택지 아래 「기타 의견」 칸에 자유롭게 적을 수 있습니다(사이드 트리의 같은 질문과 같은 칸). 참고를 끌어다 놓는 칸은 그 아래에 있습니다.</p>
<p><b>레퍼런스 먼저</b>: 인터뷰 첫 화면 다음에 레퍼런스 사이트 목록이 나옵니다. 둘러보다 찾은 자료의 주소·파일 경로를 「찾은 레퍼런스」에 넣고 따를 것(전체 양식·글·디자인·구성·움직임)을 고르세요. 「레퍼런스만 먼저 보내기」를 누르면 Claude가 레퍼런스를 분석해 그 양식대로 질문지를 채운 페이지를 다시 드리고(「레퍼런스에서」 표시), 직접 답하면서 질문마다 「레퍼런스대로」를 골라도 됩니다.</p>
<p><b>제외</b>: 이번 자료에 해당하지 않거나 정하지 않을 질문은 「제외」를 누릅니다.</p>
<p><b>대화 추천</b>: Claude가 대화로 알아본 내용으로 답을 미리 골라 둔 칸에는 「대화 추천」과 한 줄 이유가 붙습니다. 다르면 그냥 바꾸면 「추천 → 바꿈」으로 바뀌고, 화면 위 요약판에 그대로·바꿈 수가 보입니다. 바꾼 것은 기록되어 다음 추천이 알아서 고쳐집니다(확인 질문 없음).</p>

  root.appendChild(c);
}
