<style>
.thd-root{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 40%,#14304a,#0a1220 70%);color:#e8eef7;font-size:min(3.5vw,5.6vh)}
.thd-fig{position:absolute;left:5%;top:9%;width:42%;height:68%}
.thd-fig svg{width:100%;height:100%}
.thd-ring{fill:none;stroke:#38bdf8}
.thd-flow{fill:none;stroke:#7dd3fc;stroke-width:1.6;stroke-dasharray:5 9;stroke-linecap:round;animation:thd-flow 2.4s linear infinite}
@keyframes thd-flow{to{stroke-dashoffset:28}}
.thd-txt{position:absolute;left:52%;right:5%;top:16%}
.thd-txt h3{margin:0 0 .4em;font-size:1.15em;line-height:1.3;letter-spacing:-.02em}
.thd-txt p{margin:0;font-size:.78em;color:#9fb3c8;line-height:1.5}
.thd-txt b{color:#fbbf24}
.thd-cap{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);white-space:nowrap;font-size:.78em;padding:.3em .9em;border-radius:.3em;background:rgba(0,0,0,.55);color:#fff}
.thd-tag{position:absolute;right:3%;top:4%;font-size:.6em;padding:.1em .6em;border-radius:1em;border:1px solid rgba(255,255,255,.25);color:#9fb3c8}
@media (prefers-reduced-motion:reduce){.thd-flow{animation:none!important}}
</style>
<div class="thd-root">
  <div class="thd-fig" role="img" aria-label="전선 단면 둘레를 도는 자기장 고리">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><radialGradient id="thd-g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
      <radialGradient id="thd-cu" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#ffd8a8"/><stop offset=".55" stop-color="#d07a3c"/><stop offset="1" stop-color="#6b3212"/></radialGradient></defs>
      <circle cx="50" cy="50" r="48" fill="url(#thd-g)"/>
      <circle class="thd-ring" cx="50" cy="50" r="16" stroke-width="2.4" opacity=".9"/>
      <circle class="thd-ring" cx="50" cy="50" r="28" stroke-width="1.6" opacity=".55"/>
      <circle class="thd-ring" cx="50" cy="50" r="40" stroke-width="1" opacity=".3"/>
      <circle class="thd-flow" cx="50" cy="50" r="22"/>
      <circle cx="50" cy="50" r="7" fill="url(#thd-cu)"/>
    </svg>
  </div>
  <div class="thd-txt"><h3>전류가 흐르면<br>자기장이 생긴다</h3><p>전선 둘레를 따라<br><b>둥근 고리</b> 모양으로</p></div>
  <div class="thd-cap">전선 둘레로 둥근 자기장이 생깁니다</div>
  <div class="thd-tag">어두운 바탕</div>
</div>
