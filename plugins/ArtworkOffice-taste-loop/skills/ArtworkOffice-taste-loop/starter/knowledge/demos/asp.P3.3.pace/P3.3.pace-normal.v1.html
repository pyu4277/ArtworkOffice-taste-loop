<style>
.pcn{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 95% at 50% 38%,#1c2747 0%,#0b1020 72%);color:#e2e8f0;font-family:var(--font);box-shadow:inset 0 0 0 1px var(--line)}
.pcn svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pcn text{font-family:var(--font)}
.pcn-ndl{transform-box:fill-box;transform-origin:center}
.pcn-dots>*{animation:pcn-up 2.2s linear infinite}
.pcn-dots>:nth-child(1){animation-delay:-0s}.pcn-dots>:nth-child(2){animation-delay:-0.4s}.pcn-dots>:nth-child(3){animation-delay:-0.7s}.pcn-dots>:nth-child(4){animation-delay:-1.1s}.pcn-dots>:nth-child(5){animation-delay:-1.5s}.pcn-dots>:nth-child(6){animation-delay:-1.8s}
@keyframes pcn-up{0%{transform:translateY(0);opacity:0}8%,90%{opacity:1}100%{transform:translateY(-176px);opacity:0}}
.pcn-wire{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform 0.7s ease-out}
.pcn-dots{opacity:0;transition:opacity 0.7s}
.pcn-rg{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 0.9799999999999999s ease-out}
.pcn-ahs,.pcn-cmp{opacity:0;transition:opacity 0.7s}
.pcn-ndl{transition:transform 0.84s ease-in-out 0.7s}
.pcn-s1 .pcn-wire,.pcn-s2 .pcn-wire,.pcn-s3 .pcn-wire{transform:none}
.pcn-s1 .pcn-cmp,.pcn-s2 .pcn-cmp,.pcn-s3 .pcn-cmp{opacity:1}
.pcn-s2 .pcn-dots,.pcn-s3 .pcn-dots{opacity:1}
.pcn-s3 .pcn-rg{stroke-dashoffset:0}.pcn-s3 .pcn-ahs{opacity:1}.pcn-s3 .pcn-ndl{transform:rotate(79deg)}
.pcn-top{position:absolute;left:3%;right:3%;top:4%;display:flex;align-items:center;gap:.5em;font-size:clamp(9px,3vw,19px)}
.pcn-pip{width:1.6em;height:.32em;border-radius:99px;background:rgba(148,163,184,.35);transition:background .2s}
.pcn-pip.on{background:#5eead4}
.pcn-clk{margin-left:auto;font-variant-numeric:tabular-nums;color:#cbd5e1;background:rgba(0,0,0,.45);border-radius:6px;padding:.05em .5em}
.pcn-cap{position:absolute;left:4%;right:4%;bottom:5%;text-align:center;font-size:clamp(10px,3.7vw,26px);font-weight:600}
.pcn-cap span{background:rgba(0,0,0,.72);padding:.15em .6em;border-radius:6px}
.pcn-bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:#5eead4}
@media (prefers-reduced-motion:reduce){.pcn *{animation:none!important;transition:none!important}.pcn-dots>:nth-child(1){transform:translateY(-14px)}.pcn-dots>:nth-child(2){transform:translateY(-39px)}.pcn-dots>:nth-child(3){transform:translateY(-64px)}.pcn-dots>:nth-child(4){transform:translateY(-89px)}.pcn-dots>:nth-child(5){transform:translateY(-114px)}.pcn-dots>:nth-child(6){transform:translateY(-139px)}}
</style>
<div class="pcn" id="pcn-root"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><defs><linearGradient id="pcn-cu" x1="0" x2="1"><stop offset="0" stop-color="#7a3f18"/><stop offset=".45" stop-color="#f2b47c"/><stop offset="1" stop-color="#6b3514"/></linearGradient><radialGradient id="pcn-gw"><stop offset="0" stop-color="#fffbe6"/><stop offset=".45" stop-color="#fde047"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient></defs><g class="pcn-rings pcn-bk" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round"><path class="pcn-rg pcn-rg1" pathLength="1" d="M114 104 A36 10 0 0 1 186 104" opacity=".55"/><path class="pcn-rg pcn-rg2" pathLength="1" d="M90 104 A60 16 0 0 1 210 104" opacity=".55"/><path class="pcn-rg pcn-rg3" pathLength="1" d="M64 104 A86 23 0 0 1 236 104" opacity=".55"/></g><g class="pcn-ahs"><path class="pcn-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(132 95.3) rotate(170.9)" opacity=".6"/><path class="pcn-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(120 90.1) rotate(171.2)" opacity=".6"/><path class="pcn-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(107 84.1) rotate(171.2)" opacity=".6"/></g><g class="pcn-wire"><rect x="146" y="12" width="8" height="176" rx="3" fill="url(#pcn-cu)"/><rect x="148.6" y="15" width="1.5" height="170" rx=".7" fill="#ffe2c4" opacity=".5"/></g><g class="pcn-dots"><circle cx="150" cy="188" r="5" fill="url(#pcn-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcn-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcn-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcn-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcn-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcn-gw)"/></g><g class="pcn-rings pcn-fr" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round"><path class="pcn-rg pcn-rg1" pathLength="1" d="M186 104 A36 10 0 0 1 114 104"/><path class="pcn-rg pcn-rg2" pathLength="1" d="M210 104 A60 16 0 0 1 90 104"/><path class="pcn-rg pcn-rg3" pathLength="1" d="M236 104 A86 23 0 0 1 64 104"/></g><g class="pcn-ahs"><path class="pcn-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(168 112.7) rotate(-9.1)"/><path class="pcn-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(180 117.9) rotate(-8.8)"/><path class="pcn-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(193 123.9) rotate(-8.8)"/></g><g class="pcn-cmp"><circle cx="252" cy="138" r="16" fill="#0f172a" stroke="#94a3b8" stroke-width="1.6"/><path d="M252 124v3M252 149v3M238 138h3M263 138h3" stroke="#64748b" stroke-width="1.2"/><g class="pcn-ndl"><path d="M252 125 L255.2 138 L248.8 138Z" fill="#f87171"/><path d="M252 151 L255.2 138 L248.8 138Z" fill="#e2e8f0"/></g><circle cx="252" cy="138" r="1.8" fill="#0f172a" stroke="#94a3b8" stroke-width=".8"/></g></svg><div class="pcn-top"><i class="pcn-pip"></i><i class="pcn-pip"></i><i class="pcn-pip"></i><span class="pcn-clk" id="pcn-clk">경과 0.0초</span></div><div class="pcn-cap"><span id="pcn-cap">① 전선을 세웁니다</span></div><div class="pcn-bar" id="pcn-bar"></div></div>
<script>
(function(){var r=document.getElementById('pcn-root'),clk=document.getElementById('pcn-clk'),cap=document.getElementById('pcn-cap');if(!r)return;var pips=r.querySelectorAll('.pcn-pip'),caps=["① 전선을 세웁니다","② 전선에 전류를 흘립니다","③ 나침반 바늘이 돕니다"],t0=Date.now(),s=0;
function go(n){s=n;r.classList.remove('pcn-s1','pcn-s2','pcn-s3');if(n)r.classList.add('pcn-s'+n);for(var i=0;i<pips.length;i++)pips[i].className='pcn-pip'+(i<n?' on':'');if(n)cap.textContent=caps[n-1];}
function tick(){clk.textContent='경과 '+((Date.now()-t0)/1000).toFixed(1)+'초';}
var bar=document.getElementById('pcn-bar'),S=3200,C=10240;
function run(){t0=Date.now();go(0);setTimeout(function(){go(1);},50);setTimeout(function(){go(2);},50+S);setTimeout(function(){go(3);},50+2*S);setTimeout(run,C);}
run();setInterval(function(){tick();bar.style.width=Math.min(100,(Date.now()-t0)/C*100)+'%';},100);})();
</script>
