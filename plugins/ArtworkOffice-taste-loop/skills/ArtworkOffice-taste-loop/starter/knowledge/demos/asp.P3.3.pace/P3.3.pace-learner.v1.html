<style>
.pcl{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 95% at 50% 38%,#1c2747 0%,#0b1020 72%);color:#e2e8f0;font-family:var(--font);box-shadow:inset 0 0 0 1px var(--line)}
.pcl svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pcl text{font-family:var(--font)}
.pcl-ndl{transform-box:fill-box;transform-origin:center}
.pcl-dots>*{animation:pcl-up 2.2s linear infinite}
.pcl-dots>:nth-child(1){animation-delay:-0s}.pcl-dots>:nth-child(2){animation-delay:-0.4s}.pcl-dots>:nth-child(3){animation-delay:-0.7s}.pcl-dots>:nth-child(4){animation-delay:-1.1s}.pcl-dots>:nth-child(5){animation-delay:-1.5s}.pcl-dots>:nth-child(6){animation-delay:-1.8s}
@keyframes pcl-up{0%{transform:translateY(0);opacity:0}8%,90%{opacity:1}100%{transform:translateY(-176px);opacity:0}}
.pcl-wire{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform 0.9s ease-out}
.pcl-dots{opacity:0;transition:opacity 0.9s}
.pcl-rg{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.26s ease-out}
.pcl-ahs,.pcl-cmp{opacity:0;transition:opacity 0.9s}
.pcl-ndl{transition:transform 1.08s ease-in-out 0.9s}
.pcl-s1 .pcl-wire,.pcl-s2 .pcl-wire,.pcl-s3 .pcl-wire{transform:none}
.pcl-s1 .pcl-cmp,.pcl-s2 .pcl-cmp,.pcl-s3 .pcl-cmp{opacity:1}
.pcl-s2 .pcl-dots,.pcl-s3 .pcl-dots{opacity:1}
.pcl-s3 .pcl-rg{stroke-dashoffset:0}.pcl-s3 .pcl-ahs{opacity:1}.pcl-s3 .pcl-ndl{transform:rotate(79deg)}
.pcl-top{position:absolute;left:3%;right:3%;top:4%;display:flex;align-items:center;gap:.5em;font-size:clamp(9px,3vw,19px)}
.pcl-pip{width:1.6em;height:.32em;border-radius:99px;background:rgba(148,163,184,.35);transition:background .2s}
.pcl-pip.on{background:#5eead4}
.pcl-clk{margin-left:auto;font-variant-numeric:tabular-nums;color:#cbd5e1;background:rgba(0,0,0,.45);border-radius:6px;padding:.05em .5em}
.pcl-cap{position:absolute;left:4%;right:4%;bottom:5%;text-align:center;font-size:clamp(10px,3.7vw,26px);font-weight:600}
.pcl-cap span{background:rgba(0,0,0,.72);padding:.15em .6em;border-radius:6px}
.pcl-cap{right:30%;left:3%;text-align:left}
.pcl-nx{position:absolute;right:3%;bottom:15%;background:var(--acc);color:var(--bg);border:0;border-radius:999px;padding:.25em 1em;font-size:clamp(10px,3.4vw,21px);font-weight:700}
.pcl-nx:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pcl *{animation:none!important;transition:none!important}.pcl-dots>:nth-child(1){transform:translateY(-14px)}.pcl-dots>:nth-child(2){transform:translateY(-39px)}.pcl-dots>:nth-child(3){transform:translateY(-64px)}.pcl-dots>:nth-child(4){transform:translateY(-89px)}.pcl-dots>:nth-child(5){transform:translateY(-114px)}.pcl-dots>:nth-child(6){transform:translateY(-139px)}}
</style>
<div class="pcl" id="pcl-root"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><defs><linearGradient id="pcl-cu" x1="0" x2="1"><stop offset="0" stop-color="#7a3f18"/><stop offset=".45" stop-color="#f2b47c"/><stop offset="1" stop-color="#6b3514"/></linearGradient><radialGradient id="pcl-gw"><stop offset="0" stop-color="#fffbe6"/><stop offset=".45" stop-color="#fde047"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient></defs><g class="pcl-rings pcl-bk" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round"><path class="pcl-rg pcl-rg1" pathLength="1" d="M114 104 A36 10 0 0 1 186 104" opacity=".55"/><path class="pcl-rg pcl-rg2" pathLength="1" d="M90 104 A60 16 0 0 1 210 104" opacity=".55"/><path class="pcl-rg pcl-rg3" pathLength="1" d="M64 104 A86 23 0 0 1 236 104" opacity=".55"/></g><g class="pcl-ahs"><path class="pcl-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(132 95.3) rotate(170.9)" opacity=".6"/><path class="pcl-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(120 90.1) rotate(171.2)" opacity=".6"/><path class="pcl-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(107 84.1) rotate(171.2)" opacity=".6"/></g><g class="pcl-wire"><rect x="146" y="12" width="8" height="176" rx="3" fill="url(#pcl-cu)"/><rect x="148.6" y="15" width="1.5" height="170" rx=".7" fill="#ffe2c4" opacity=".5"/></g><g class="pcl-dots"><circle cx="150" cy="188" r="5" fill="url(#pcl-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcl-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcl-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcl-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcl-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcl-gw)"/></g><g class="pcl-rings pcl-fr" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round"><path class="pcl-rg pcl-rg1" pathLength="1" d="M186 104 A36 10 0 0 1 114 104"/><path class="pcl-rg pcl-rg2" pathLength="1" d="M210 104 A60 16 0 0 1 90 104"/><path class="pcl-rg pcl-rg3" pathLength="1" d="M236 104 A86 23 0 0 1 64 104"/></g><g class="pcl-ahs"><path class="pcl-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(168 112.7) rotate(-9.1)"/><path class="pcl-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(180 117.9) rotate(-8.8)"/><path class="pcl-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(193 123.9) rotate(-8.8)"/></g><g class="pcl-cmp"><circle cx="252" cy="138" r="16" fill="#0f172a" stroke="#94a3b8" stroke-width="1.6"/><path d="M252 124v3M252 149v3M238 138h3M263 138h3" stroke="#64748b" stroke-width="1.2"/><g class="pcl-ndl"><path d="M252 125 L255.2 138 L248.8 138Z" fill="#f87171"/><path d="M252 151 L255.2 138 L248.8 138Z" fill="#e2e8f0"/></g><circle cx="252" cy="138" r="1.8" fill="#0f172a" stroke="#94a3b8" stroke-width=".8"/></g></svg><div class="pcl-top"><i class="pcl-pip"></i><i class="pcl-pip"></i><i class="pcl-pip"></i><span class="pcl-clk" id="pcl-clk">경과 0.0초</span></div><div class="pcl-cap"><span id="pcl-cap">① 전선을 세웁니다</span></div><button type="button" class="pcl-nx" id="pcl-nx">다음</button></div><span class="hint-chip">눌러 보세요</span>
<script>
(function(){var r=document.getElementById('pcl-root'),clk=document.getElementById('pcl-clk'),cap=document.getElementById('pcl-cap');if(!r)return;var pips=r.querySelectorAll('.pcl-pip'),caps=["① 전선을 세웁니다","② 전선에 전류를 흘립니다","③ 나침반 바늘이 돕니다"],t0=Date.now(),s=0;
function go(n){s=n;r.classList.remove('pcl-s1','pcl-s2','pcl-s3');if(n)r.classList.add('pcl-s'+n);for(var i=0;i<pips.length;i++)pips[i].className='pcl-pip'+(i<n?' on':'');if(n)cap.textContent=caps[n-1];}
function tick(){clk.textContent='경과 '+((Date.now()-t0)/1000).toFixed(1)+'초';}
var nx=document.getElementById('pcl-nx');
function upd(){nx.textContent=s>=3?'처음부터':'다음';}
nx.addEventListener('click',function(){if(s>=3){go(0);t0=Date.now();setTimeout(function(){go(1);upd();},60);}else go(s+1);upd();});
setTimeout(function(){go(1);upd();},60);setInterval(tick,100);})();
</script>
