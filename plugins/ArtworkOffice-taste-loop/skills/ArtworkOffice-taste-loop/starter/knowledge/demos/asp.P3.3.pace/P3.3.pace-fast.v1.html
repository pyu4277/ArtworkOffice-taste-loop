<style>
.pcf{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 95% at 50% 38%,#1c2747 0%,#0b1020 72%);color:#e2e8f0;font-family:var(--font);box-shadow:inset 0 0 0 1px var(--line)}
.pcf svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pcf text{font-family:var(--font)}
.pcf-ndl{transform-box:fill-box;transform-origin:center}
.pcf-dots>*{animation:pcf-up 2.2s linear infinite}
.pcf-dots>:nth-child(1){animation-delay:-0s}.pcf-dots>:nth-child(2){animation-delay:-0.4s}.pcf-dots>:nth-child(3){animation-delay:-0.7s}.pcf-dots>:nth-child(4){animation-delay:-1.1s}.pcf-dots>:nth-child(5){animation-delay:-1.5s}.pcf-dots>:nth-child(6){animation-delay:-1.8s}
@keyframes pcf-up{0%{transform:translateY(0);opacity:0}8%,90%{opacity:1}100%{transform:translateY(-176px);opacity:0}}
.pcf-wire{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform 0.3s ease-out}
.pcf-dots{opacity:0;transition:opacity 0.3s}
.pcf-rg{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 0.42s ease-out}
.pcf-ahs,.pcf-cmp{opacity:0;transition:opacity 0.3s}
.pcf-ndl{transition:transform 0.36s ease-in-out 0.3s}
.pcf-s1 .pcf-wire,.pcf-s2 .pcf-wire,.pcf-s3 .pcf-wire{transform:none}
.pcf-s1 .pcf-cmp,.pcf-s2 .pcf-cmp,.pcf-s3 .pcf-cmp{opacity:1}
.pcf-s2 .pcf-dots,.pcf-s3 .pcf-dots{opacity:1}
.pcf-s3 .pcf-rg{stroke-dashoffset:0}.pcf-s3 .pcf-ahs{opacity:1}.pcf-s3 .pcf-ndl{transform:rotate(79deg)}
.pcf-top{position:absolute;left:3%;right:3%;top:4%;display:flex;align-items:center;gap:.5em;font-size:clamp(9px,3vw,19px)}
.pcf-pip{width:1.6em;height:.32em;border-radius:99px;background:rgba(148,163,184,.35);transition:background .2s}
.pcf-pip.on{background:#5eead4}
.pcf-clk{margin-left:auto;font-variant-numeric:tabular-nums;color:#cbd5e1;background:rgba(0,0,0,.45);border-radius:6px;padding:.05em .5em}
.pcf-cap{position:absolute;left:4%;right:4%;bottom:5%;text-align:center;font-size:clamp(10px,3.7vw,26px);font-weight:600}
.pcf-cap span{background:rgba(0,0,0,.72);padding:.15em .6em;border-radius:6px}
.pcf-bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:#5eead4}
@media (prefers-reduced-motion:reduce){.pcf *{animation:none!important;transition:none!important}.pcf-dots>:nth-child(1){transform:translateY(-14px)}.pcf-dots>:nth-child(2){transform:translateY(-39px)}.pcf-dots>:nth-child(3){transform:translateY(-64px)}.pcf-dots>:nth-child(4){transform:translateY(-89px)}.pcf-dots>:nth-child(5){transform:translateY(-114px)}.pcf-dots>:nth-child(6){transform:translateY(-139px)}}
</style>
<div class="pcf" id="pcf-root"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><defs><linearGradient id="pcf-cu" x1="0" x2="1"><stop offset="0" stop-color="#7a3f18"/><stop offset=".45" stop-color="#f2b47c"/><stop offset="1" stop-color="#6b3514"/></linearGradient><radialGradient id="pcf-gw"><stop offset="0" stop-color="#fffbe6"/><stop offset=".45" stop-color="#fde047"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient></defs><g class="pcf-rings pcf-bk" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round"><path class="pcf-rg pcf-rg1" pathLength="1" d="M114 104 A36 10 0 0 1 186 104" opacity=".55"/><path class="pcf-rg pcf-rg2" pathLength="1" d="M90 104 A60 16 0 0 1 210 104" opacity=".55"/><path class="pcf-rg pcf-rg3" pathLength="1" d="M64 104 A86 23 0 0 1 236 104" opacity=".55"/></g><g class="pcf-ahs"><path class="pcf-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(132 95.3) rotate(170.9)" opacity=".6"/><path class="pcf-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(120 90.1) rotate(171.2)" opacity=".6"/><path class="pcf-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(107 84.1) rotate(171.2)" opacity=".6"/></g><g class="pcf-wire"><rect x="146" y="12" width="8" height="176" rx="3" fill="url(#pcf-cu)"/><rect x="148.6" y="15" width="1.5" height="170" rx=".7" fill="#ffe2c4" opacity=".5"/></g><g class="pcf-dots"><circle cx="150" cy="188" r="5" fill="url(#pcf-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcf-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcf-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcf-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcf-gw)"/><circle cx="150" cy="188" r="5" fill="url(#pcf-gw)"/></g><g class="pcf-rings pcf-fr" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round"><path class="pcf-rg pcf-rg1" pathLength="1" d="M186 104 A36 10 0 0 1 114 104"/><path class="pcf-rg pcf-rg2" pathLength="1" d="M210 104 A60 16 0 0 1 90 104"/><path class="pcf-rg pcf-rg3" pathLength="1" d="M236 104 A86 23 0 0 1 64 104"/></g><g class="pcf-ahs"><path class="pcf-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(168 112.7) rotate(-9.1)"/><path class="pcf-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(180 117.9) rotate(-8.8)"/><path class="pcf-ah" d="M-4 -3.4 L4 0 L-4 3.4Z" fill="#5eead4" transform="translate(193 123.9) rotate(-8.8)"/></g><g class="pcf-cmp"><circle cx="252" cy="138" r="16" fill="#0f172a" stroke="#94a3b8" stroke-width="1.6"/><path d="M252 124v3M252 149v3M238 138h3M263 138h3" stroke="#64748b" stroke-width="1.2"/><g class="pcf-ndl"><path d="M252 125 L255.2 138 L248.8 138Z" fill="#f87171"/><path d="M252 151 L255.2 138 L248.8 138Z" fill="#e2e8f0"/></g><circle cx="252" cy="138" r="1.8" fill="#0f172a" stroke="#94a3b8" stroke-width=".8"/></g></svg><div class="pcf-top"><i class="pcf-pip"></i><i class="pcf-pip"></i><i class="pcf-pip"></i><span class="pcf-clk" id="pcf-clk">경과 0.0초</span></div><div class="pcf-cap"><span id="pcf-cap">① 전선을 세웁니다</span></div><div class="pcf-bar" id="pcf-bar"></div></div>
<script>
(function(){var r=document.getElementById('pcf-root'),clk=document.getElementById('pcf-clk'),cap=document.getElementById('pcf-cap');if(!r)return;var pips=r.querySelectorAll('.pcf-pip'),caps=["① 전선을 세웁니다","② 전선에 전류를 흘립니다","③ 나침반 바늘이 돕니다"],t0=Date.now(),s=0;
function go(n){s=n;r.classList.remove('pcf-s1','pcf-s2','pcf-s3');if(n)r.classList.add('pcf-s'+n);for(var i=0;i<pips.length;i++)pips[i].className='pcf-pip'+(i<n?' on':'');if(n)cap.textContent=caps[n-1];}
function tick(){clk.textContent='경과 '+((Date.now()-t0)/1000).toFixed(1)+'초';}
var bar=document.getElementById('pcf-bar'),S=1200,C=3840;
function run(){t0=Date.now();go(0);setTimeout(function(){go(1);},50);setTimeout(function(){go(2);},50+S);setTimeout(function(){go(3);},50+2*S);setTimeout(run,C);}
run();setInterval(function(){tick();bar.style.width=Math.min(100,(Date.now()-t0)/C*100)+'%';},100);})();
</script>
