<style>
.tdt{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 95% at 50% 38%,#1c2747 0%,#0b1020 72%);color:#e2e8f0;font-family:var(--font);box-shadow:inset 0 0 0 1px var(--line)}
.tdt svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tdt text{font-family:var(--font)}
.tdt-ndl{transform-box:fill-box;transform-origin:center}
.tdt-dots>*{animation:tdt-up 2.4s linear infinite}
.tdt-dots>:nth-child(1){animation-delay:-0s}.tdt-dots>:nth-child(2){animation-delay:-0.4s}.tdt-dots>:nth-child(3){animation-delay:-0.8s}.tdt-dots>:nth-child(4){animation-delay:-1.2s}.tdt-dots>:nth-child(5){animation-delay:-1.6s}.tdt-dots>:nth-child(6){animation-delay:-2s}
@keyframes tdt-up{0%{transform:translateY(0);opacity:0}8%,90%{opacity:1}100%{transform:translateY(-176px);opacity:0}}
.tdt-dots{animation:tdt-show 10s infinite both}
@keyframes tdt-show{0%,30%{opacity:0}36%,88%{opacity:1}95%,100%{opacity:0}}
.tdt-rg{stroke-dasharray:1;stroke-dashoffset:1;animation:tdt-draw 10s infinite both}
.tdt-rg2{animation-delay:.15s}.tdt-rg3{animation-delay:.3s}
@keyframes tdt-draw{0%,40%{stroke-dashoffset:1;opacity:1}54%,88%{stroke-dashoffset:0;opacity:1}95%,100%{stroke-dashoffset:0;opacity:0}}
.tdt-ahs{animation:tdt-ahs 10s infinite both}
@keyframes tdt-ahs{0%,52%{opacity:0}58%,88%{opacity:1}95%,100%{opacity:0}}
.tdt-ndl{animation:tdt-turn 10s infinite both}
@keyframes tdt-turn{0%,56%{transform:rotate(0)}66%,90%{transform:rotate(79deg)}98%,100%{transform:rotate(0)}}
.tdt-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35em;background:rgba(8,12,26,.78);animation:tdt-card 10s infinite both}
.tdt-no{font-size:clamp(9px,3vw,18px);font-weight:700;color:#0b1020;background:#5eead4;border-radius:999px;padding:.05em .8em}
.tdt-tt{font-size:clamp(13px,5.3vw,36px);font-weight:800;letter-spacing:-.01em;text-align:center;padding:0 6%;word-break:keep-all}
.tdt-ln{height:2px;width:34%;background:linear-gradient(90deg,transparent,#5eead4,transparent);transform-origin:center;animation:tdt-ln 10s infinite both}
.tdt-dt{font-size:clamp(9px,3.2vw,20px);color:#94a3b8;font-variant-numeric:tabular-nums;letter-spacing:.06em}
@keyframes tdt-card{0%{opacity:0}4%,22%{opacity:1}28%,100%{opacity:0}}
@keyframes tdt-ln{0%,4%{transform:scaleX(0)}12%,100%{transform:scaleX(1)}}
.tdt-band{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:.6em;padding:2.2% 3.5% 5%;background:linear-gradient(rgba(0,0,0,.6),transparent);font-size:clamp(8px,2.9vw,19px);animation:tdt-band 10s infinite both}
.tdt-band b{color:#0b1020;background:#5eead4;border-radius:4px;padding:0 .4em}
.tdt-band i{margin-left:auto;font-style:normal;color:#94a3b8;font-variant-numeric:tabular-nums}
@keyframes tdt-band{0%,26%{opacity:0;transform:translateY(-60%)}31%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.tdt *{animation:none!important;transition:none!important}.tdt-dots>:nth-child(1){transform:translateY(-14px)}.tdt-dots>:nth-child(2){transform:translateY(-39px)}.tdt-dots>:nth-child(3){transform:translateY(-64px)}.tdt-dots>:nth-child(4){transform:translateY(-89px)}.tdt-dots>:nth-child(5){transform:translateY(-114px)}.tdt-dots>:nth-child(6){transform:translateY(-139px)}.tdt-rg{stroke-dashoffset:0}.tdt-ndl{transform:rotate(79deg)}.tdt-card{display:none}}
</style>
