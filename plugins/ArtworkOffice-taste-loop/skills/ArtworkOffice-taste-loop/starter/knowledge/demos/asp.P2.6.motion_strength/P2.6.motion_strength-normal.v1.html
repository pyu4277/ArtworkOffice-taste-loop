<style>
.msn{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 95% at 50% 38%,#1c2747 0%,#0b1020 72%);color:#e2e8f0;font-family:var(--font);box-shadow:inset 0 0 0 1px var(--line)}

.msn text{font-family:var(--font)}
.msn-ndl{transform-box:fill-box;transform-origin:center}
.msn-dots>*{animation:msn-up 1.9s linear infinite}

.msn-dots{animation:msn-show 5s infinite both}

.msn-arw{transform-box:fill-box;transform-origin:50% 100%;animation:msn-arw 5s ease-out infinite both}

.msn-rings,.msn-ahs{transform-box:view-box;transform-origin:150px 104px;animation:msn-rg 5s ease-out infinite both}
@keyframes msn-rg{0%,18%{opacity:0;transform:scale(.85)}34%,90%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.msn *{animation:none!important;transition:none!important}.msn-dots>:nth-child(1){transform:translateY(-14px)}.msn-dots>:nth-child(2){transform:translateY(-39px)}.msn-dots>:nth-child(3){transform:translateY(-64px)}.msn-dots>:nth-child(4){transform:translateY(-89px)}.msn-dots>:nth-child(5){transform:translateY(-114px)}.msn-dots>:nth-child(6){transform:translateY(-139px)}.msn-rip{display:none}}
