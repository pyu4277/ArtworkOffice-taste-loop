<style>
.stln{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 95% at 50% 38%,#1c2747 0%,#0b1020 72%);color:#e2e8f0;font-family:var(--font);box-shadow:inset 0 0 0 1px var(--line)}
.stln svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stln text{font-family:var(--font)}
.stln-ndl{transform-box:fill-box;transform-origin:center}
.stln-dots>*{animation:stln-up 2.2s linear infinite}
.stln-dots>:nth-child(1){animation-delay:-0s}.stln-dots>:nth-child(2){animation-delay:-0.4s}.stln-dots>:nth-child(3){animation-delay:-0.9s}.stln-dots>:nth-child(4){animation-delay:-1.3s}.stln-dots>:nth-child(5){animation-delay:-1.8s}
@keyframes stln-up{0%{transform:translateY(0);opacity:0}8%,90%{opacity:1}100%{transform:translateY(-176px);opacity:0}}
.stln-ndl{animation:stln-turn 6s ease-in-out infinite}
@keyframes stln-turn{0%,12%{transform:rotate(0)}30%,82%{transform:rotate(79deg)}100%{transform:rotate(0)}}
.stln-paused *{animation-play-state:paused!important}
.stln-btn{position:absolute;left:3%;bottom:4%;display:inline-flex;align-items:center;gap:.35em;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:.2em .85em;font-size:clamp(10px,3.3vw,20px);font-weight:600}
.stln-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stln-ic{width:.7em;height:.7em;background:currentColor;clip-path:polygon(0 0,35% 0,35% 100%,0 100%,0 0,65% 0,100% 0,100% 100%,65% 100%,65% 0)}
.stln-paused .stln-ic{clip-path:polygon(0 0,100% 50%,0 100%)}
.stln-tag{position:absolute;right:3%;top:4%;font-size:clamp(9px,2.9vw,18px);font-weight:700;color:var(--fg);background:var(--bar);border:1px solid var(--line);border-radius:6px;padding:.05em .55em;opacity:0;transition:opacity .2s}
.stln-paused .stln-tag{opacity:1}
.stln-rings{animation:stln-pu 2.2s ease-in-out infinite}
@keyframes stln-pu{0%,100%{opacity:.25}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.stln *{animation:none!important;transition:none!important}.stln-dots>:nth-child(1){transform:translateY(-14px)}.stln-dots>:nth-child(2){transform:translateY(-44px)}.stln-dots>:nth-child(3){transform:translateY(-74px)}.stln-dots>:nth-child(4){transform:translateY(-104px)}.stln-dots>:nth-child(5){transform:translateY(-134px)}.stln-ndl{transform:rotate(79deg)}}
</style>
<div class="stln" id="stln-root"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><defs><linearGradient id="stln-cu" x1="0" x2="1"><stop offset="0" stop-color="#7a3f18"/><stop offset=".45" stop-color="#f2b47c"/><stop offset="1" stop-color="#6b3514"/></linearGradient><radialGradient id="stln-gw"><stop offset="0" stop-color="#fffbe6"/><stop offset=".45" stop-color="#fde047"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient></defs><g class="stln-rings stln-bk" fill="none" stroke="#5eead4" stroke-width="1.3" stroke-linecap="round"><path class="stln-rg stln-rg1" pathLength="1" d="M114 104 A36 10 0 0 1 186 104" opacity=".55"/><path class="stln-rg stln-rg2" pathLength="1" d="M90 104 A60 16 0 0 1 210 104" opacity=".55"/><path class="stln-rg stln-rg3" pathLength="1" d="M64 104 A86 23 0 0 1 236 104" opacity=".55"/></g><g class="stln-wire"><rect x="146" y="12" width="8" height="176" rx="3" fill="url(#stln-cu)"/><rect x="148.6" y="15" width="1.5" height="170" rx=".7" fill="#ffe2c4" opacity=".5"/></g><g class="stln-dots"><circle cx="150" cy="188" r="3" fill="#fde68a"/><circle cx="150" cy="188" r="3" fill="#fde68a"/><circle cx="150" cy="188" r="3" fill="#fde68a"/><circle cx="150" cy="188" r="3" fill="#fde68a"/><circle cx="150" cy="188" r="3" fill="#fde68a"/></g><g class="stln-rings stln-fr" fill="none" stroke="#5eead4" stroke-width="1.3" stroke-linecap="round"><path class="stln-rg stln-rg1" pathLength="1" d="M186 104 A36 10 0 0 1 114 104"/><path class="stln-rg stln-rg2" pathLength="1" d="M210 104 A60 16 0 0 1 90 104"/><path class="stln-rg stln-rg3" pathLength="1" d="M236 104 A86 23 0 0 1 64 104"/></g><g class="stln-cmp"><circle cx="252" cy="138" r="16" fill="#0f172a" stroke="#94a3b8" stroke-width="1.6"/><path d="M252 124v3M252 149v3M238 138h3M263 138h3" stroke="#64748b" stroke-width="1.2"/><g class="stln-ndl"><path d="M252 125 L255.2 138 L248.8 138Z" fill="#f87171"/><path d="M252 151 L255.2 138 L248.8 138Z" fill="#e2e8f0"/></g><circle cx="252" cy="138" r="1.8" fill="#0f172a" stroke="#94a3b8" stroke-width=".8"/></g></svg><span class="stln-tag">멈춘 화면</span><button type="button" class="stln-btn" id="stln-btn" aria-pressed="false"><i class="stln-ic"></i><span>멈춤</span></button></div><span class="hint-chip">눌러 보세요</span>
<script>
(function(){var r=document.getElementById('stln-root'),b=document.getElementById('stln-btn');if(!r||!b)return;b.addEventListener('click',function(){var on=r.classList.toggle('stln-paused');b.lastChild.textContent=on?'재생':'멈춤';b.setAttribute('aria-pressed',on?'true':'false');});})();
</script>
