<style>
.stly{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 95% at 50% 38%,#1c2747 0%,#0b1020 72%);color:#e2e8f0;font-family:var(--font);box-shadow:inset 0 0 0 1px var(--line)}
.stly svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stly text{font-family:var(--font)}
.stly-ndl{transform-box:fill-box;transform-origin:center}
.stly-dots>*{animation:stly-up 2.2s linear infinite}
.stly-dots>:nth-child(1){animation-delay:-0s}.stly-dots>:nth-child(2){animation-delay:-0.4s}.stly-dots>:nth-child(3){animation-delay:-0.9s}.stly-dots>:nth-child(4){animation-delay:-1.3s}.stly-dots>:nth-child(5){animation-delay:-1.8s}
@keyframes stly-up{0%{transform:translateY(0);opacity:0}8%,90%{opacity:1}100%{transform:translateY(-176px);opacity:0}}
.stly-ndl{animation:stly-turn 6s ease-in-out infinite}
@keyframes stly-turn{0%,12%{transform:rotate(0)}30%,82%{transform:rotate(79deg)}100%{transform:rotate(0)}}
.stly-paused *{animation-play-state:paused!important}
.stly-btn{position:absolute;left:3%;bottom:4%;display:inline-flex;align-items:center;gap:.35em;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:.2em .85em;font-size:clamp(10px,3.3vw,20px);font-weight:600}
.stly-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stly-ic{width:.7em;height:.7em;background:currentColor;clip-path:polygon(0 0,35% 0,35% 100%,0 100%,0 0,65% 0,100% 0,100% 100%,65% 100%,65% 0)}
.stly-paused .stly-ic{clip-path:polygon(0 0,100% 50%,0 100%)}
.stly-tag{position:absolute;right:3%;top:4%;font-size:clamp(9px,2.9vw,18px);font-weight:700;color:var(--fg);background:var(--bar);border:1px solid var(--line);border-radius:6px;padding:.05em .55em;opacity:0;transition:opacity .2s}
.stly-paused .stly-tag{opacity:1}
@media (prefers-reduced-motion:reduce){.stly *{animation:none!important;transition:none!important}.stly-dots>:nth-child(1){transform:translateY(-14px)}.stly-dots>:nth-child(2){transform:translateY(-44px)}.stly-dots>:nth-child(3){transform:translateY(-74px)}.stly-dots>:nth-child(4){transform:translateY(-104px)}.stly-dots>:nth-child(5){transform:translateY(-134px)}.stly-ndl{transform:rotate(79deg)}}
</style>
