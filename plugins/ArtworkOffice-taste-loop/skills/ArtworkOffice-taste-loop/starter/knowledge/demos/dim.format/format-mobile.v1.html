<style>
.f8-w{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:18px;padding:8px 12px 26px}
.f8-ph{height:100%;max-height:200px;aspect-ratio:9/18;border:3px solid var(--fg);border-radius:16px;position:relative;overflow:hidden;background:var(--bg);flex:none}
.f8-nt{position:absolute;top:3px;left:35%;width:30%;height:5px;border-radius:3px;background:var(--fg);z-index:2}
.f8-sc{position:absolute;inset:0;overflow-y:auto;padding:12px 7px 10px;scrollbar-width:none}
.f8-sc::-webkit-scrollbar{display:none}
.f8-sc b{display:block;font-size:10px;margin:2px 0 5px}
.f8-pic{height:46px;border-radius:5px;background:var(--soft);margin-bottom:6px}
.f8-sc .ln{height:4px;margin:4px 0}
.f8-cd{border:1px solid var(--line);border-radius:6px;padding:4px 5px;margin:7px 0;background:var(--bar)}
.f8-cd i{display:block;width:40%;height:5px;border-radius:2px;background:var(--acc);opacity:.7;margin-bottom:3px}
.f8-tx{max-width:46%;font-size:12px}
.f8-tx strong{display:block;font-size:13px;margin-bottom:4px}
.f8-tx p{margin:0 0 6px;color:var(--muted);font-size:11px}
.f8-sw{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--acc)}
.f8-sw span{display:inline-block;animation:f8-mv 1.6s ease-in-out infinite}
@keyframes f8-mv{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
</style>
<div class="f8-w">
<div class="f8-ph"><div class="f8-nt"></div><div class="f8-sc" id="f8-sc">
<b>1. 들어가며</b><div class="f8-pic"></div><div class="ln" style="width:94%"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:88%"></div>
<div class="f8-cd"><i></i><div class="ln" style="width:90%"></div><div class="ln" style="width:70%"></div></div>
<b>2. 그림으로 보기</b><div class="f8-pic"></div><div class="ln" style="width:86%"></div><div class="ln" style="width:92%"></div>
<div class="f8-cd"><i></i><div class="ln" style="width:84%"></div></div>
<b>3. 정리</b><div class="ln" style="width:90%"></div><div class="ln" style="width:64%"></div><div class="f8-pic" style="height:30px"></div>
</div></div>
<div class="f8-tx"><strong>휴대폰 폭 우선</strong><p>내용을 한 줄로 쌓아 위에서 아래로 내려 읽습니다.</p><div class="f8-sw"><span>↕</span>손가락으로 내리기</div></div>
</div>
<span class="hint-chip">화면을 내려 보세요</span>
<script>
(function(){
var sc=document.getElementById('f8-sc'),on=true,wait=0;
var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function stop(){on=false;}
['pointerdown','wheel','touchstart','keydown'].forEach(function(t){sc.addEventListener(t,stop,{passive:true});});
if(!rm){setInterval(function(){
if(!on)return;
var m=sc.scrollHeight-sc.clientHeight;if(m<=0)return;
if(wait>0){wait--;return;}
if(sc.scrollTop>=m-1){sc.scrollTop=0;wait=30;}else{sc.scrollTop=sc.scrollTop+1;if(sc.scrollTop>=m-1)wait=30;}
},40);}
})();
</script>
