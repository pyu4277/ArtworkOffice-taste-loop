<style>
.mtm-root{position:absolute;inset:0;display:flex;align-items:center;gap:4%;padding:5%;font-size:min(3.5vw,5.6vh)}
.mtm-fig{position:relative;flex:0 0 44%;aspect-ratio:1;max-height:100%}
.mtm-fig svg{width:100%;height:100%;overflow:visible}
.mtm-ring{fill:none;stroke:var(--acc)}
.mtm-wave{fill:none;stroke:var(--acc);stroke-width:1.5;transform-origin:50px 50px;animation:mtm-wave 3.6s ease-out infinite;opacity:0}
.mtm-w2{animation-delay:-1.2s}.mtm-w3{animation-delay:-2.4s}
@keyframes mtm-wave{0%{transform:scale(.15);opacity:.95;stroke-width:3}100%{transform:scale(1);opacity:0;stroke-width:.4}}
.mtm-core{fill:url(#mtm-cu);stroke:#5a2a10;stroke-width:.8}
.mtm-txt{flex:1;display:flex;flex-direction:column;gap:.55em}
.mtm-txt h3{margin:0;font-size:1.12em;line-height:1.3;letter-spacing:-.02em}
.mtm-big{display:flex;align-items:center;gap:.4em;font-weight:800;font-size:1.05em}
.mtm-big b{color:var(--acc)}
.mtm-big i{font-style:normal;color:var(--muted)}
.mtm-txt p{margin:0;font-size:.74em;color:var(--muted)}
.mtm-txt>*{animation:mtm-in 7s ease infinite both}
.mtm-txt>:nth-child(2){animation-delay:.6s}.mtm-txt>:nth-child(3){animation-delay:1.1s}
@keyframes mtm-in{0%{opacity:0;transform:translateX(.6em)}8%,92%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.mtm-wave{display:none}.mtm-txt>*{animation:none!important}}
</style>
<div class="mtm-root">
  <div class="mtm-fig" role="img" aria-label="전선 둘레로 퍼질수록 흐려지는 자기장 고리">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><radialGradient id="mtm-cu" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#ffd2a1"/><stop offset=".55" stop-color="#c8743a"/><stop offset="1" stop-color="#6b3212"/></radialGradient></defs>
      <circle class="mtm-ring" cx="50" cy="50" r="14" stroke-width="3" opacity=".95"/>
      <circle class="mtm-ring" cx="50" cy="50" r="24" stroke-width="2" opacity=".6"/>
      <circle class="mtm-ring" cx="50" cy="50" r="35" stroke-width="1.2" opacity=".35"/>
      <circle class="mtm-ring" cx="50" cy="50" r="47" stroke-width=".7" opacity=".18"/>
      <circle class="mtm-wave" cx="50" cy="50" r="47"/>
      <circle class="mtm-wave mtm-w2" cx="50" cy="50" r="47"/>
      <circle class="mtm-wave mtm-w3" cx="50" cy="50" r="47"/>
      <circle class="mtm-core" cx="50" cy="50" r="6"/>
    </svg>
  </div>
  <div class="mtm-txt">
    <h3>전선에서 멀어질수록<br>자기장은 약해집니다</h3>
    <div class="mtm-big"><span>거리 <b>2배</b></span><i>→</i><span>세기 <b>절반</b></span></div>
    <p>수식 없이 말과 그림으로</p>
  </div>
</div>
