<style>
.dno-root{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9em;padding:6%;font-size:min(3.5vw,5.6vh);background:radial-gradient(ellipse at 50% 60%,var(--soft),var(--bg) 70%)}
.dno-msg{font-size:1.75em;font-weight:800;letter-spacing:-.03em;text-align:center;line-height:1.2;opacity:0;transform:translateY(.3em);transition:opacity .6s,transform .6s}
.dno-msg b{color:var(--acc)}
.dno-bars{display:flex;align-items:flex-end;gap:1.6em;height:3.4em}
.dno-bar{display:flex;flex-direction:column;align-items:center;gap:.2em;font-size:.66em;color:var(--muted)}
.dno-col{width:3.2em;border-radius:.3em .3em 0 0;background:var(--acc);background:linear-gradient(var(--acc),color-mix(in srgb,var(--acc) 60%,var(--bg)));transform-origin:bottom;transform:scaleY(0);transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.dno-b1 .dno-col{height:4.2em}.dno-b2 .dno-col{height:2.1em;transition-delay:.35s}
.dno-k1 .dno-msg{opacity:1;transform:none}
.dno-k2 .dno-col{transform:none}
.dno-out .dno-msg,.dno-out .dno-bars{opacity:0}
.dno-bars{transition:opacity .45s}
.dno-rs *{transition:none!important}
</style>
<div class="dno-root">
  <div class="dno-msg">거리 <b>2배</b> → 세기 <b>절반</b></div>
  <div class="dno-bars" aria-hidden="true">
    <div class="dno-bar dno-b1"><div class="dno-col"></div>1 cm</div>
    <div class="dno-bar dno-b2"><div class="dno-col"></div>2 cm</div>
  </div>
</div>
<script>
(function(P,N,T){var R=document.querySelector('.'+P+'root');if(!R)return;var C=R.classList,i=0;
function all(f){for(var j=1;j<=N;j++)C[f](P+'k'+j)}
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){all('add');return}
function step(){setTimeout(function(){if(i<N){i++;C.add(P+'k'+i);step()}else{C.add(P+'out');setTimeout(function(){C.add(P+'rs');all('remove');C.remove(P+'out');void R.offsetWidth;C.remove(P+'rs');i=0;step()},550)}},T[i])}
step()})('dno-',2,[400,900,3600]);
</script>
