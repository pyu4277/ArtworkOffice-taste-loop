<style>
.dgg-root{position:absolute;inset:0;overflow:hidden;font-size:min(3.5vw,5.6vh);color:#fff;background:#120d24}
.dgg-art{position:absolute;inset:-4%;background:
  radial-gradient(ellipse 40% 35% at 28% 30%,rgba(255,184,92,.55),transparent 70%),
  radial-gradient(ellipse 45% 40% at 78% 72%,rgba(139,92,246,.6),transparent 70%),
  radial-gradient(ellipse 50% 45% at 52% 50%,rgba(20,184,166,.45),transparent 70%),
  linear-gradient(160deg,#1c1238,#0d2b3c 55%,#2b1a10);
  animation:dgg-kb 11s ease-in-out infinite alternate}
.dgg-art::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(118deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px),
  repeating-linear-gradient(28deg,rgba(0,0,0,.06) 0 3px,transparent 3px 11px);mix-blend-mode:overlay}
@keyframes dgg-kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-1.5%,1%)}}
.dgg-ring{position:absolute;left:50%;top:50%;border-radius:50%;border:.18em solid rgba(255,214,150,.7);
  box-shadow:0 0 .7em rgba(255,190,110,.55),inset 0 0 .6em rgba(120,220,255,.35);filter:blur(.6px);
  transform:translate(-50%,-50%) scaleY(.32);animation:dgg-pulse 4.5s ease-in-out infinite}
.dgg-r1{width:22%;aspect-ratio:1;border-color:rgba(255,236,190,.9)}
.dgg-r2{width:38%;aspect-ratio:1;animation-delay:-1.1s;opacity:.8}
.dgg-r3{width:56%;aspect-ratio:1;animation-delay:-2.2s;border-color:rgba(160,220,255,.55)}
.dgg-r4{width:76%;aspect-ratio:1;animation-delay:-3.3s;border-color:rgba(190,160,255,.4)}
@keyframes dgg-pulse{0%,100%{opacity:.45}50%{opacity:1}}
.dgg-wire{position:absolute;left:50%;top:-6%;width:2.6%;height:112%;transform:translateX(-50%) rotate(4deg);border-radius:1em;
  background:linear-gradient(90deg,#6b2f0d,#ffd29a 45%,#e48a45 60%,#5a240a);box-shadow:0 0 1.2em rgba(255,170,90,.9),0 0 2.8em rgba(255,140,60,.5)}
.dgg-dust{position:absolute;inset:0;background:
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.8) 0 1px,transparent 2px),
  radial-gradient(circle at 70% 20%,rgba(255,230,180,.7) 0 1px,transparent 2px),
  radial-gradient(circle at 85% 55%,rgba(200,240,255,.7) 0 1px,transparent 2px),
  radial-gradient(circle at 35% 75%,rgba(255,255,255,.6) 0 1px,transparent 2px),
  radial-gradient(circle at 60% 85%,rgba(255,220,160,.6) 0 1px,transparent 2px);
  background-size:60% 60%;animation:dgg-drift 14s linear infinite;opacity:.8}
@keyframes dgg-drift{to{background-position:30% -40%,-20% -30%,10% -50%,-30% -20%,20% -45%}}
.dgg-chip{position:absolute;left:3.5%;top:5%;font-size:.7em;padding:.2em .7em;border-radius:1em;background:rgba(10,10,20,.55);border:1px solid rgba(255,255,255,.25);letter-spacing:.02em}
.dgg-cap{position:absolute;left:0;right:0;bottom:0;padding:9% 4% 3.5%;background:linear-gradient(transparent,rgba(5,5,15,.82));display:flex;flex-direction:column;gap:.15em}
.dgg-cap b{font-size:1.02em;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.dgg-cap span{font-size:.7em;opacity:.78}
</style>
<div class="dgg-root" role="img" aria-label="전류가 흐르는 전선 둘레에 빛나는 고리가 퍼지는 그림 같은 장면(생성 이미지 느낌 예시)">
  <div class="dgg-art"></div>
  <div class="dgg-ring dgg-r4"></div>
  <div class="dgg-ring dgg-r3"></div>
  <div class="dgg-ring dgg-r2"></div>
  <div class="dgg-wire"></div>
  <div class="dgg-ring dgg-r1"></div>
  <div class="dgg-dust"></div>
  <div class="dgg-chip">생성 이미지 느낌(예시)</div>
  <div class="dgg-cap"><b>전류가 흐르면 자기장이 생긴다</b><span>분위기는 살지만 눈금·값은 정확하지 않을 수 있음</span></div>
</div>
