<style>
.dgc-root{position:absolute;inset:0;display:flex;flex-direction:column;padding:3.5% 4% 2%;font-size:min(3.5vw,5.6vh)}
.dgc-head{display:flex;align-items:baseline;justify-content:space-between;gap:.6em}
.dgc-head b{font-size:1.02em;letter-spacing:-.01em}
.dgc-head span{color:var(--muted);font-size:.76em;white-space:nowrap}
.dgc-svg{flex:1;min-height:0;width:100%;margin-top:1.5%;transition:opacity .45s}
.dgc-svg text{font-family:var(--font);fill:var(--muted);font-size:7.5px}
.dgc-svg .dgc-ax{fill:var(--fg);font-weight:600}
.dgc-grid line{stroke:var(--line);stroke-width:.6}
.dgc-axis{stroke:var(--fg);stroke-width:1.1;fill:none}
.dgc-curve{fill:none;stroke:var(--acc);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s cubic-bezier(.4,0,.2,1)}
.dgc-dot{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center;transition:opacity .35s,transform .35s}
.dgc-dot circle{fill:var(--bg);stroke:var(--acc);stroke-width:1.8}
.dgc-svg .dgc-dot text{fill:var(--fg);font-weight:700;font-size:8px}
.dgc-d2{transition-delay:.25s}.dgc-d3{transition-delay:.5s}
.dgc-guide{opacity:0;transition:opacity .5s}
.dgc-guide path{fill:none;stroke:var(--warn);stroke-width:1.2;stroke-dasharray:3 2}
.dgc-svg .dgc-guide text{fill:var(--warn);font-weight:700;font-size:8px}
.dgc-k1 .dgc-curve{stroke-dashoffset:0}
.dgc-k2 .dgc-dot{opacity:1;transform:none}
.dgc-k3 .dgc-guide{opacity:1}
.dgc-out .dgc-svg{opacity:0}
.dgc-rs *{transition:none!important}
</style>

<script>
(function(P,N,T){var R=document.querySelector('.'+P+'root');if(!R)return;var C=R.classList,i=0;
