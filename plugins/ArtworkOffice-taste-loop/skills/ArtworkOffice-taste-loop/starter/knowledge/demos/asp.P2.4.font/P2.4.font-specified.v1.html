<style>
.fnp-root{position:absolute;inset:0;display:flex;flex-direction:column;gap:4%;padding:4.5% 4.5% 3.5%;font-size:min(3.5vw,5.6vh)}
.fnp-top b{font-size:.95em}
.fnp-memo{display:flex;align-items:center;gap:.5em;padding:.45em .7em;border-radius:.4em;background:var(--bar);border:1px dashed var(--muted);font-size:.78em}
.fnp-memo>span:first-child{color:var(--muted);white-space:nowrap}
.fnp-in{font-weight:700;color:var(--fg);min-height:1.2em}
.fnp-car{display:inline-block;width:.08em;height:1.05em;margin-left:.08em;vertical-align:-.15em;background:var(--acc);animation:fnp-blink 1s steps(1) infinite}
@keyframes fnp-blink{50%{opacity:0}}
.fnp-card{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;gap:.3em;padding:.4em .9em;border-radius:.45em;border:1px solid var(--line);background:var(--bg);min-height:0}
.fnp-s{font-size:1.3em;line-height:1.25;letter-spacing:-.02em;font-weight:700;transition:opacity .35s;word-break:keep-all}
.fnp-sub{font-size:.66em;color:var(--muted)}
.fnp-root.fnp-on .fnp-s{font-family:"Batang","AppleMyungjo","Noto Serif KR",serif;letter-spacing:0;font-weight:700}
.fnp-root.fnp-on .fnp-card{border-color:var(--acc)}
.fnp-flip{opacity:0}
.fnp-foot{display:flex;gap:.5em;align-items:center;font-size:.64em}
.fnp-pill{padding:.12em .6em;border-radius:1em;border:1px solid var(--warn);color:var(--warn);font-weight:700}
.fnp-note{color:var(--muted);margin-left:auto}
@media (prefers-reduced-motion:reduce){.fnp-car{animation:none!important}}
</style>
<div class="fnp-root">
  <div class="fnp-top"><b>지정 글꼴</b></div>
  <div class="fnp-memo"><span>메모 · 글꼴 이름:</span><span class="fnp-in"></span><span class="fnp-car"></span></div>
  <div class="fnp-card">
    <div class="fnp-s">전류가 흐르면 자기장이 생긴다</div>
    <div class="fnp-sub">지금은 기본 고딕</div>
  </div>
  <div class="fnp-foot"><span class="fnp-pill">글꼴 파일·사용 허락 확인 필요</span><span class="fnp-note">(글꼴 모양은 예시)</span></div>
</div>
<script>
(function(){var R=document.querySelector('.fnp-root');if(!R)return;
var I=R.querySelector('.fnp-in'),S=R.querySelector('.fnp-s'),U=R.querySelector('.fnp-sub'),W='기관에서 정한 글꼴';
function done(){R.classList.add('fnp-on');U.textContent='메모에 적은 글꼴로 통일'}
function reset(){R.classList.remove('fnp-on');I.textContent='';U.textContent='지금은 기본 고딕'}
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){I.textContent=W;done();return}
function run(){reset();var n=0;
(function type(){if(n<=W.length){I.textContent=W.slice(0,n);n++;setTimeout(type,n===1?700:150)}
else{S.classList.add('fnp-flip');setTimeout(function(){done();S.classList.remove('fnp-flip');setTimeout(function(){S.classList.add('fnp-flip');setTimeout(function(){S.classList.remove('fnp-flip');run()},350)},3000)},400)}})()}
run()})();
</script>
