<style>
.lyt-root{position:absolute;inset:0;display:grid;grid-template-columns:52% 1fr;grid-template-rows:24% 1fr;gap:3.5%;padding:4.5%;font-size:min(3.5vw,5.6vh)}
.lyt-slot{position:relative;border:1.5px dashed var(--acc);border:1.5px dashed color-mix(in srgb,var(--acc) 55%,transparent);border-radius:.4em;overflow:hidden}
.lyt-title{grid-column:1/3}
.lyt-lab{position:absolute;right:.4em;top:.3em;z-index:2;font-size:.52em;color:var(--acc);background:var(--bg);padding:0 .4em;border-radius:.6em;opacity:.9}
.lyt-c{position:absolute;inset:0;display:flex;align-items:center;opacity:0}
.lyt-c1{opacity:1}
.lyt-anim .lyt-c{animation:lyt-cyc 9s ease-in-out infinite}
.lyt-anim .lyt-c2{animation-delay:-6s}.lyt-anim .lyt-c3{animation-delay:-3s}
@keyframes lyt-cyc{0%,30%{opacity:1;transform:none}34%{opacity:0;transform:translateY(-8%)}96%{opacity:0;transform:translateY(8%)}100%{opacity:1;transform:none}}
.lyt-title .lyt-c{padding:0 .7em;font-weight:800;font-size:1.05em;letter-spacing:-.02em}
.lyt-title .lyt-c small{font-size:.58em;color:var(--muted);font-weight:600;margin-left:.6em}
.lyt-pic .lyt-c{inset:6%;border-radius:.3em;overflow:hidden}
.lyt-fil{background:radial-gradient(circle,#e9a066 0 5%,#8a4518 7%,transparent 9%),radial-gradient(circle,transparent 25%,#ddd6c7 72%),repeating-conic-gradient(#ddd6c7 0 2.2deg,transparent 2.2deg 4.3deg),repeating-radial-gradient(circle,rgba(30,28,26,.9) 0 .9px,transparent 1.5px 5px),#ddd6c7}
.lyt-gr,.lyt-dir{background:var(--bar)}
.lyt-pic svg{width:100%;height:100%}
.lyt-txt .lyt-c{padding:0 .8em;font-size:.8em;line-height:1.5;color:var(--muted)}
.lyt-txt .lyt-c b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){.lyt-anim .lyt-c{animation:none!important}}
</style>
<div class="lyt-root lyt-anim">
  <div class="lyt-slot lyt-title"><span class="lyt-lab">제목 자리</span>
    <div class="lyt-c lyt-c1">전류와 자기장<small>1/3</small></div>
    <div class="lyt-c lyt-c2">거리와 세기<small>2/3</small></div>
    <div class="lyt-c lyt-c3">방향 정하기<small>3/3</small></div>
  </div>
  <div class="lyt-slot lyt-pic"><span class="lyt-lab">그림 자리</span>
    <div class="lyt-c lyt-c1 lyt-fil" role="img" aria-label="쇳가루 사진 느낌"></div>
    <div class="lyt-c lyt-c2 lyt-gr"><svg viewBox="0 0 100 70" aria-hidden="true"><path d="M12 8V60H94" fill="none" stroke="var(--muted)" stroke-width="1.5"/><path d="M22 10Q30 40 48 47T92 55" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/></svg></div>
    <div class="lyt-c lyt-c3 lyt-dir"><svg viewBox="0 0 100 70" aria-hidden="true"><circle cx="50" cy="35" r="22" fill="none" stroke="var(--acc)" stroke-width="2.5"/><path d="M54 10.5L48 13L54 16" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="35" r="5" fill="#c8743a"/><circle cx="50" cy="35" r="1.6" fill="#fff"/></svg></div>
  </div>
  <div class="lyt-slot lyt-txt"><span class="lyt-lab">설명 자리</span>
    <div class="lyt-c lyt-c1"><span>쇳가루가 전선 둘레에 <b>고리 모양</b>으로 늘어섭니다</span></div>
    <div class="lyt-c lyt-c2"><span>거리가 <b>2배</b>가 되면 세기는 <b>절반</b>이 됩니다</span></div>
    <div class="lyt-c lyt-c3"><span>엄지를 전류 방향으로 두면 <b>감아쥔 손가락</b>이 자기장 방향</span></div>
  </div>
</div>
