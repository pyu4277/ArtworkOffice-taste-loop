<style>
.mpf{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 95% at 50% 38%,#1c2747 0%,#0b1020 72%);color:#e2e8f0;font-family:var(--font);box-shadow:inset 0 0 0 1px var(--line)}
.mpf svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mpf text{font-family:var(--font)}
.mpf-ndl{transform-box:fill-box;transform-origin:center}
.mpf-dots>*{animation:mpf-up 2.2s linear infinite}

.mpf-ttl{position:absolute;left:4%;top:5%;font-size:clamp(10px,3.6vw,24px);font-weight:800;letter-spacing:-.01em}
.mpf-ttl small{display:block;font-size:.62em;font-weight:500;color:#94a3b8}

</style>
