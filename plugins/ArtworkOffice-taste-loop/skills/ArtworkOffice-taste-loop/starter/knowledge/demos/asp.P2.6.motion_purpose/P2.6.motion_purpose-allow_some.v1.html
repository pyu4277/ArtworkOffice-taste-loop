<style>
.mpa{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 95% at 50% 38%,#1c2747 0%,#0b1020 72%);color:#e2e8f0;font-family:var(--font);box-shadow:inset 0 0 0 1px var(--line)}
.mpa svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mpa text{font-family:var(--font)}
.mpa-ndl{transform-box:fill-box;transform-origin:center}
.mpa-dots>*{animation:mpa-up 2.2s linear infinite}
.mpa-dots>:nth-child(1){animation-delay:-0s}.mpa-dots>:nth-child(2){animation-delay:-0.4s}.mpa-dots>:nth-child(3){animation-delay:-0.7s}.mpa-dots>:nth-child(4){animation-delay:-1.1s}.mpa-dots>:nth-child(5){animation-delay:-1.5s}.mpa-dots>:nth-child(6){animation-delay:-1.8s}
@keyframes mpa-up{0%{transform:translateY(0);opacity:0}8%,90%{opacity:1}100%{transform:translateY(-176px);opacity:0}}
.mpa-ttl{position:absolute;left:4%;top:5%;font-size:clamp(10px,3.6vw,24px);font-weight:800;letter-spacing:-.01em}
.mpa-ttl small{display:block;font-size:.62em;font-weight:500;color:#94a3b8}
.mpa-pt{animation:mpa-fl 7s ease-in-out infinite}
@keyframes mpa-fl{0%{transform:translate(0,10px);opacity:0}30%{opacity:.75}70%{opacity:.5}100%{transform:translate(8px,-26px);opacity:0}}
.mpa-ttl{animation:mpa-ps 3s ease-in-out infinite;transform-origin:left center}
@keyframes mpa-ps{0%,100%{transform:scale(1);text-shadow:0 0 0 rgba(94,234,212,0)}50%{transform:scale(1.04);text-shadow:0 0 12px rgba(94,234,212,.75)}}
.mpa-sw{position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(165,180,252,.10) 50%,transparent 65%);background-size:250% 100%;animation:mpa-sw 6s linear infinite}
@keyframes mpa-sw{0%{background-position:120% 0}100%{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){.mpa *{animation:none!important;transition:none!important}.mpa-dots>:nth-child(1){transform:translateY(-14px)}.mpa-dots>:nth-child(2){transform:translateY(-39px)}.mpa-dots>:nth-child(3){transform:translateY(-64px)}.mpa-dots>:nth-child(4){transform:translateY(-89px)}.mpa-dots>:nth-child(5){transform:translateY(-114px)}.mpa-dots>:nth-child(6){transform:translateY(-139px)}.mpa-pt{opacity:.5}}
</style>
