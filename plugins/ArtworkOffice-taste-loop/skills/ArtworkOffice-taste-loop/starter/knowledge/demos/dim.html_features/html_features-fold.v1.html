<style>
.fd-w{position:absolute;inset:0;padding:8px 12px 28px;overflow:auto}
.fd-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.fd-top strong{font-size:13px}
.fd-all{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:0 8px;font-size:11px}
.fd-it{border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:var(--bg)}
.fd-hd{display:flex;align-items:center;gap:6px;width:100%;border:0;background:var(--bar);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:600;text-align:left}
.fd-ar{display:inline-block;transition:transform .25s;color:var(--acc)}
.fd-it.fd-on .fd-ar{transform:rotate(90deg)}
.fd-it.fd-on .fd-hd{border-radius:8px 8px 0 0}
.fd-pn{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.fd-it.fd-on .fd-pn{grid-template-rows:1fr}
.fd-in{overflow:hidden}
.fd-in>div{padding:4px 10px 6px}
.fd-in p{margin:0;font-size:12px;color:var(--muted)}
.fd-n{margin-left:auto;font-weight:400;font-size:11px;color:var(--muted)}
</style>
<div class="fd-w">
<div class="fd-top"><strong>정리 노트</strong><button type="button" class="fd-all" id="fd-all">모두 펼치기</button></div>
<div class="fd-it fd-on"><button type="button" class="fd-hd"><span class="fd-ar">▸</span>핵심 한 줄<span class="fd-n">늘 보이게</span></button><div class="fd-pn"><div class="fd-in"><div><p>가장 중요한 내용은 처음부터 펼쳐 둡니다.</p><div class="ln" style="width:80%"></div></div></div></div></div>
<div class="fd-it"><button type="button" class="fd-hd"><span class="fd-ar">▸</span>자세한 설명<span class="fd-n">눌러서 보기</span></button><div class="fd-pn"><div class="fd-in"><div><p>더 알고 싶은 사람만 펼쳐 읽습니다.</p><div class="ln" style="width:92%"></div><div class="ln" style="width:74%"></div><div class="ln" style="width:60%"></div></div></div></div></div>
<div class="fd-it"><button type="button" class="fd-hd"><span class="fd-ar">▸</span>정답과 풀이<span class="fd-n">눌러서 보기</span></button><div class="fd-pn"><div class="fd-in"><div><p>먼저 스스로 풀어 본 뒤에 펼칩니다.</p><div class="ln" style="width:70%"></div><div class="ln" style="width:52%"></div></div></div></div></div>
</div>
<span class="hint-chip">제목을 눌러 보세요</span>
<script>
(function(){
var its=document.querySelectorAll('.fd-it'),all=document.getElementById('fd-all');
function sync(){var open=0;its.forEach(function(x){if(x.classList.contains('fd-on'))open++;});all.textContent=open===its.length?'모두 접기':'모두 펼치기';}
its.forEach(function(it){it.querySelector('.fd-hd').addEventListener('click',function(){it.classList.toggle('fd-on');sync();});});
all.addEventListener('click',function(){var openAll=all.textContent==='모두 펼치기';its.forEach(function(x){x.classList.toggle('fd-on',openAll);});sync();});
sync();
})();
</script>
