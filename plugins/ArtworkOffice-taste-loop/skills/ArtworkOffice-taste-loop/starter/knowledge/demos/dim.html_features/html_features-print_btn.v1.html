<style>
.pr-w{position:absolute;inset:0;display:flex;flex-direction:column}
.pr-h{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-bottom:1px solid var(--line)}
.pr-h strong{font-size:13px}
.pr-go{display:flex;align-items:center;gap:5px;border:1px solid var(--acc);color:var(--acc);background:var(--bg);border-radius:6px;padding:1px 9px;font-size:12px}
.pr-b{flex:1;padding:8px 14px;display:flex;gap:12px}
.pr-b>div{flex:1}
.pr-b p{margin:0 0 4px;font-size:12px;color:var(--muted)}
.pr-im{flex:.7!important;border-radius:8px;background:var(--soft)}
.pr-ov{position:absolute;inset:0;background:#525a66;display:none;align-items:center;justify-content:center;gap:14px;padding:8px}
.pr-ov.pr-on{display:flex;animation:demo-fade .3s both}
.pr-pg{height:92%;aspect-ratio:210/297;background:#fff;color:#1b2430;box-shadow:0 4px 16px rgba(0,0,0,.4);padding:6% 7%;display:flex;flex-direction:column;gap:4%}
.pr-pg b{font-size:9px}
.pr-pg i{display:block;height:3px;border-radius:2px;background:#cbd5e1}
.pr-pg .pr-pi{height:22%;background:#e2e8f0;border-radius:3px}
.pr-pg small{margin-top:auto;font-size:7px;color:#64748b;text-align:center}
.pr-sd{display:flex;flex-direction:column;gap:6px;color:#fff;font-size:12px;min-width:110px}
.pr-tag{align-self:flex-start;background:#fbbf24;color:#1b2430;border-radius:999px;padding:0 8px;font-size:11px;font-weight:700}
.pr-sd span{opacity:.85;font-size:11px}
.pr-sd button{border:0;border-radius:6px;padding:3px 8px;font-size:12px}
.pr-ok{background:#2dd4bf;color:#0b1f1c}
.pr-x{background:#e5e7eb;color:#1b2430}
</style>
<div class="pr-w">
<div class="pr-h"><strong>학습지 · 관찰 기록</strong><button type="button" class="pr-go" id="pr-go"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2"/><path d="M6 14h12v7H6z"/></svg>인쇄·PDF 저장</button></div>
<div class="pr-b"><div><p>관찰한 것을 적어 봅시다.</p><div class="ln" style="width:92%"></div><div class="ln" style="width:76%"></div><div class="ln" style="width:84%"></div><div class="ln" style="width:58%"></div></div><div class="pr-im"></div></div>
<div class="pr-ov" id="pr-ov">
<div class="pr-pg"><b>학습지 · 관찰 기록</b><i style="width:90%"></i><i style="width:70%"></i><div class="pr-pi"></div><i style="width:86%"></i><i style="width:60%"></i><i style="width:78%"></i><small>- 1 -</small></div>
<div class="pr-sd"><span class="pr-tag">예시 화면</span><strong>인쇄 미리보기</strong><span>용지: A4 세로<br>대상: 프린터 또는 PDF로 저장</span><button type="button" class="pr-ok" id="pr-ok">인쇄(예시)</button><button type="button" class="pr-x" id="pr-x">닫기</button></div>
</div>
</div>
<span class="hint-chip" id="pr-hc">단추를 눌러 보세요</span>
<script>
(function(){
var ov=document.getElementById('pr-ov'),ok=document.getElementById('pr-ok');
document.getElementById('pr-go').addEventListener('click',function(){ov.classList.add('pr-on');ok.textContent='인쇄(예시)';});
ok.addEventListener('click',function(){ok.textContent='예시라 실제로 인쇄하지 않음';});
document.getElementById('pr-x').addEventListener('click',function(){ov.classList.remove('pr-on');});
})();
</script>
