<style>
.th-box{--th-bg:#ffffff;--th-fg:#1b2430;--th-mu:#64748b;--th-ln:#e2e8f0;--th-ac:#0f766e;--th-so:#e3f3ef;--th-bar:#f1f5f9;
position:absolute;inset:0;background:var(--th-bg);color:var(--th-fg);display:flex;flex-direction:column;transition:background .4s,color .4s}
.th-box.th-dark{--th-bg:#111827;--th-fg:#e5e7eb;--th-mu:#94a3b8;--th-ln:#334155;--th-ac:#2dd4bf;--th-so:#12302d;--th-bar:#1f2937}
.th-h{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-bottom:1px solid var(--th-ln);background:var(--th-bar);transition:background .4s,border-color .4s}
.th-h strong{font-size:13px}
.th-t{display:flex;align-items:center;gap:5px;border:1px solid var(--th-ln);background:var(--th-bg);color:var(--th-fg);border-radius:999px;padding:2px 10px 2px 4px;font-size:12px;transition:background .4s,color .4s}
.th-ic{width:20px;height:20px;border-radius:50%;background:var(--th-so);display:grid;place-items:center;color:var(--th-ac)}
.th-ic svg{transition:transform .5s}
.th-dark .th-ic svg{transform:rotate(-200deg)}
.th-b{flex:1;display:flex;gap:12px;padding:10px 14px 26px}
.th-tx{flex:1.3}
.th-tx p{margin:0 0 6px;color:var(--th-mu);font-size:12px;transition:color .4s}
.th-l{height:7px;border-radius:3px;background:var(--th-ln);margin:6px 0;transition:background .4s}
.th-ch{flex:1;display:flex;align-items:flex-end;gap:6px;border-left:1px solid var(--th-ln);border-bottom:1px solid var(--th-ln);padding:0 0 0 6px}
.th-ch i{flex:1;background:var(--th-ac);border-radius:3px 3px 0 0;transition:background .4s}
</style>
<div class="th-box" id="th-box">
<div class="th-h"><strong>오늘의 자료</strong><button type="button" class="th-t" id="th-t"><span class="th-ic"><svg id="th-sv" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path id="th-pa" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span><span id="th-lb">어둡게</span></button></div>
<div class="th-b">
<div class="th-tx"><p>단추 하나로 바탕과 글자 색이 함께 바뀝니다. 그림과 도표 색도 따라 바뀝니다.</p><div class="th-l" style="width:90%"></div><div class="th-l" style="width:72%"></div><div class="th-l" style="width:82%"></div></div>
<div class="th-ch"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:85%"></i></div>
</div>
</div>
<span class="hint-chip">단추를 눌러 보세요</span>
<script>
(function(){
var box=document.getElementById('th-box'),lb=document.getElementById('th-lb'),pa=document.getElementById('th-pa');
var MOON='M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z';
var SUN='M12 7a5 5 0 1 0 0 10a5 5 0 0 0 0-10zM11 1h2v3h-2zM11 20h2v3h-2zM1 11h3v2H1zM20 11h3v2h-3zM4.2 5.6l1.4-1.4l2.1 2.1l-1.4 1.4zM16.3 17.7l1.4-1.4l2.1 2.1l-1.4 1.4zM4.2 18.4l2.1-2.1l1.4 1.4l-2.1 2.1zM16.3 6.3l2.1-2.1l1.4 1.4l-2.1 2.1z';
document.getElementById('th-t').addEventListener('click',function(){
var d=box.classList.toggle('th-dark');lb.textContent=d?'밝게':'어둡게';pa.setAttribute('d',d?SUN:MOON);
});
})();
</script>
