<style>
.fs-w{position:absolute;inset:0;display:flex;flex-direction:column}
.fs-h{flex:none;display:flex;align-items:center;gap:5px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--bar)}
.fs-h strong{font-size:12px;margin-right:auto}
.fs-h button{border:1px solid var(--line);background:var(--bg);border-radius:6px;min-width:30px;padding:1px 7px;font-weight:700}
.fs-h button:hover{border-color:var(--acc);color:var(--acc)}
.fs-m{font-size:11px}.fs-p{font-size:15px}
.fs-z{font-size:11px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.fs-b{flex:1;overflow:auto;padding:8px 14px 26px;transition:font-size .2s}
.fs-b h4{margin:0 0 4px;font-size:1.15em}
.fs-b p{margin:0 0 4px;line-height:1.6}
</style>
<div class="fs-w">
<div class="fs-h"><strong>글자 크기</strong><button type="button" class="fs-m" id="fs-dn">A−</button><span class="fs-z" id="fs-z">14px</span><button type="button" class="fs-p" id="fs-up">A+</button><button type="button" id="fs-r" style="font-weight:400;font-size:11px">기본</button></div>
<div class="fs-b" id="fs-b" style="font-size:14px">
<h4>그림자는 어떻게 생길까</h4>
<p>그림자는 빛이 물체에 가로막혀 생깁니다. 해가 낮게 떠 있는 아침과 저녁에는 그림자가 길어지고, 해가 높이 뜬 한낮에는 짧아집니다.</p>
</div>
</div>
<span class="hint-chip">A− / A+ 를 눌러 보세요</span>
<script>
(function(){
var s=14,b=document.getElementById('fs-b'),z=document.getElementById('fs-z');
function set(v){s=Math.max(10,Math.min(22,v));b.style.fontSize=s+'px';z.textContent=s+'px';}
document.getElementById('fs-dn').addEventListener('click',function(){set(s-2);});
document.getElementById('fs-up').addEventListener('click',function(){set(s+2);});
document.getElementById('fs-r').addEventListener('click',function(){set(14);});
})();
</script>
