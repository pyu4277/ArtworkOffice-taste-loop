<style>
.fu-st{position:absolute;inset:0;background:var(--bar)}
.fu-pg{position:absolute;left:12px;top:8px;right:12px;font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}
.fu-pg i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.fu-sl{position:absolute;left:14%;top:20%;width:72%;height:58%;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.12);overflow:hidden;container-type:size;
transition:left .45s ease,top .45s ease,width .45s ease,height .45s ease,border-radius .45s}
.fu-full .fu-sl{left:0;top:0;width:100%;height:100%;border-radius:0;border-color:transparent}
.fu-in{position:absolute;inset:0;padding:7cqh 7cqw}
.fu-in h3{margin:0 0 4cqh;font-size:11cqh}
.fu-in .fu-l{height:4cqh;border-radius:2cqh;background:var(--line);margin:3cqh 0}
.fu-pic{position:absolute;right:7cqw;bottom:9cqh;width:34cqw;height:44cqh;border-radius:2cqh;background:var(--soft)}
.fu-row{position:absolute;left:14%;bottom:5%;display:flex;gap:8px;align-items:center}
.fu-go{border:1px solid var(--acc);color:var(--acc);background:var(--bg);border-radius:6px;padding:1px 9px;font-size:12px}
.fu-note{font-size:10px;color:var(--muted)}
.fu-ex{position:absolute;top:6px;right:6px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:2px 10px;font-size:12px;display:none}
.fu-tag{position:absolute;top:8px;left:8px;font-size:10px;color:var(--muted);display:none}
.fu-full .fu-ex,.fu-full .fu-tag{display:block;animation:demo-fade .3s .3s both}
.fu-full .fu-row,.fu-full .hint-chip{display:none}
</style>
<div class="fu-st" id="fu-st">
<div class="fu-pg">브라우저 창 <i></i></div>
<div class="fu-sl"><div class="fu-in"><h3>장면 제목</h3><div class="fu-l" style="width:48%"></div><div class="fu-l" style="width:40%"></div><div class="fu-l" style="width:44%"></div><div class="fu-pic"></div></div>
<span class="fu-tag">(예시에서는 흉내)</span><button type="button" class="fu-ex" id="fu-ex">✕ 나가기</button></div>
<div class="fu-row"><button type="button" class="fu-go" id="fu-go">⛶ 전체 화면</button><span class="fu-note">(예시에서는 흉내)</span></div>
<span class="hint-chip">단추를 눌러 보세요</span>
</div>
<script>
(function(){
var st=document.getElementById('fu-st');
document.getElementById('fu-go').addEventListener('click',function(){st.classList.add('fu-full');});
document.getElementById('fu-ex').addEventListener('click',function(){st.classList.remove('fu-full');});
document.addEventListener('keydown',function(e){if(e.key==='Escape')st.classList.remove('fu-full');});
})();
</script>
