<style>
.vmscr-prog{position:absolute;left:0;right:0;top:0;height:3px;background:var(--bar);z-index:2}
.vmscr-prog i{display:block;height:100%;width:0;background:var(--acc)}
.vmscr-box{height:100%;overflow-y:auto;padding:4px 0 10px;scrollbar-width:thin}
.vmscr-head{padding:12px 14px 6px;border-bottom:1px solid var(--line)}
.vmscr-head h2{margin:0;font-size:16px}
.vmscr-head p{margin:0;color:var(--muted);font-size:11px}
.vmscr-box .sec{padding:8px 14px}
.vmscr-box .sec h3{font-size:13px}
.vmscr-fig{display:block;width:60%;margin:4px auto 0}
.vmscr-end{text-align:center;color:var(--muted);font-size:11px;padding:10px 0 4px}
.vmscr-down{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:14px;color:var(--acc);animation:vmscr-bob 1.2s ease-in-out infinite;transition:opacity .3s;pointer-events:none}
@keyframes vmscr-bob{50%{transform:translate(-50%,4px)}}
</style>
<div class="vmscr-prog"><i id="vmscr-p"></i></div>
<div class="vmscr-box" id="vmscr-box">
  <div class="vmscr-head"><h2>배우는 내용</h2><p>위에서 아래로 쭉 읽어 내려갑니다</p></div>
  <section class="sec"><h3>1장 원리</h3><p>처음에는 기본이 되는 생각부터 살펴봅니다.</p><div class="ln" style="width:92%"></div><div class="ln" style="width:84%"></div><div class="ln" style="width:70%"></div></section>
  <svg class="vmscr-fig" viewBox="0 0 200 60" aria-label="그림"><rect x="2" y="2" width="196" height="56" rx="8" fill="var(--soft)"/><circle cx="50" cy="30" r="14" fill="var(--acc)" opacity=".7"/><path d="M72 30 H128" stroke="var(--acc)" stroke-width="3"/><path d="M124 24 L134 30 L124 36 z" fill="var(--acc)"/><circle cx="152" cy="30" r="14" fill="none" stroke="var(--acc)" stroke-width="3"/></svg>
  <section class="sec"><h3>2장 실습</h3><p>배운 것을 직접 해 보며 익힙니다.</p><div class="ln" style="width:88%"></div><div class="ln" style="width:94%"></div><div class="ln" style="width:60%"></div><div class="ln" style="width:80%"></div></section>
  <section class="sec"><h3>3장 응용</h3><p>다른 상황에도 적용해 봅니다.</p><div class="ln" style="width:90%"></div><div class="ln" style="width:76%"></div></section>
  <section class="sec"><h3>정리</h3><p>핵심만 다시 짚어 봅니다.</p><div class="ln" style="width:72%"></div><div class="ln" style="width:58%"></div></section>
  <div class="vmscr-end">— 끝까지 읽었습니다 —</div>
</div>
<span class="vmscr-down" id="vmscr-down">↓</span>
<span class="hint-chip" style="right:14px">스크롤해 보세요</span>
<script>
(function(){
  var b=document.getElementById('vmscr-box'),p=document.getElementById('vmscr-p'),dn=document.getElementById('vmscr-down');
  function upd(){var m=b.scrollHeight-b.clientHeight;var r=m>0?b.scrollTop/m:0;p.style.width=(r*100)+'%';dn.style.opacity=b.scrollTop>10?0:1}
  b.addEventListener('scroll',upd);upd();
})();
</script>
