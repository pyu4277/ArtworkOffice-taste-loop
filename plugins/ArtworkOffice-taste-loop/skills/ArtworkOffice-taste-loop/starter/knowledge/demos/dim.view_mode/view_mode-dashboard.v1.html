<style>
.vmdb-g{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:6px;height:100%;padding:6px;background:var(--bar)}
.vmdb-c{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;min-width:0;min-height:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:4px 6px;overflow:hidden;transition:box-shadow .2s}
.vmdb-c:hover{box-shadow:0 0 0 2px var(--soft)}
.vmdb-c b{font-size:10.5px;white-space:nowrap}
.vmdb-c svg{flex:1;min-height:0;width:100%}
.vmdb-more{display:none;font-size:11px;color:var(--muted)}
.vmdb-x{display:none;position:absolute;right:6px;top:3px;font-size:12px;color:var(--muted)}
.vmdb-c.vmdb-big{position:absolute;inset:6px;z-index:3;padding:8px 12px;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:vmdb-zoom .25s ease}
.vmdb-c.vmdb-big b{font-size:14px}
.vmdb-c.vmdb-big .vmdb-more,.vmdb-c.vmdb-big .vmdb-x{display:block}
@keyframes vmdb-zoom{from{transform:scale(.6);opacity:.4}to{transform:none;opacity:1}}
.vmdb-g text{font:700 9px var(--font);fill:currentColor}
</style>
<div class="vmdb-g" id="vmdb-g">
  <button class="vmdb-c"><b>진도</b><span class="vmdb-x">✕</span>
    <svg viewBox="0 0 60 40"><circle cx="30" cy="20" r="14" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="30" cy="20" r="14" fill="none" stroke="var(--acc)" stroke-width="5" stroke-dasharray="57 88" transform="rotate(-90 30 20)"/><text x="30" y="23" text-anchor="middle">65%</text></svg>
    <span class="vmdb-more">전체 단원 중 본 만큼(예시 값)</span></button>
  <button class="vmdb-c"><b>단원별 이해</b><span class="vmdb-x">✕</span>
    <svg viewBox="0 0 60 40"><line x1="4" y1="36" x2="56" y2="36" stroke="var(--line)"/><rect x="8" y="14" width="8" height="22" fill="var(--acc)"/><rect x="20" y="8" width="8" height="28" fill="var(--acc)"/><rect x="32" y="20" width="8" height="16" fill="var(--acc)" opacity=".6"/><rect x="44" y="26" width="8" height="10" fill="var(--acc)" opacity=".4"/></svg>
    <span class="vmdb-more">1장~4장 막대 비교(예시 값)</span></button>
  <button class="vmdb-c"><b>학습 시간</b><span class="vmdb-x">✕</span>
    <svg viewBox="0 0 60 40"><polyline points="4,32 13,26 22,28 31,16 40,20 49,10 56,12" fill="none" stroke="var(--acc)" stroke-width="2"/><circle cx="49" cy="10" r="2" fill="var(--acc)"/></svg>
    <span class="vmdb-more">요일별 흐름(예시 값)</span></button>
  <button class="vmdb-c"><b>남은 과제</b><span class="vmdb-x">✕</span>
    <svg viewBox="0 0 60 40"><text x="30" y="27" text-anchor="middle" style="font-size:20px;fill:var(--warn)">3</text><text x="30" y="37" text-anchor="middle" style="font-size:6px;fill:var(--muted)">개</text></svg>
    <span class="vmdb-more">이번 주까지 낼 것(예시 값)</span></button>
  <button class="vmdb-c"><b>퀴즈 점수</b><span class="vmdb-x">✕</span>
    <svg viewBox="0 0 60 40"><rect x="4" y="10" width="52" height="7" rx="3" fill="var(--line)"/><rect x="4" y="10" width="40" height="7" rx="3" fill="var(--good)"/><rect x="4" y="24" width="52" height="7" rx="3" fill="var(--line)"/><rect x="4" y="24" width="28" height="7" rx="3" fill="var(--acc)"/></svg>
    <span class="vmdb-more">위: 내 점수, 아래: 지난번(예시 값)</span></button>
  <button class="vmdb-c"><b>출석</b><span class="vmdb-x">✕</span>
    <svg viewBox="0 0 60 40"><g fill="var(--acc)"><circle cx="8" cy="20" r="4"/><circle cx="15" cy="20" r="4"/><circle cx="22" cy="20" r="4"/><circle cx="29" cy="20" r="4"/><circle cx="36" cy="20" r="4"/></g><g fill="var(--line)"><circle cx="43" cy="20" r="4"/><circle cx="50" cy="20" r="4"/></g></svg>
    <span class="vmdb-more">7번 중 5번(예시 값)</span></button>
</div>
<span class="hint-chip" style="bottom:10px;right:10px">카드를 눌러 크게</span>
<script>
(function(){
  var cs=document.querySelectorAll('.vmdb-c');
  cs.forEach(function(c){c.onclick=function(){
    var big=c.classList.contains('vmdb-big');
    cs.forEach(function(x){x.classList.remove('vmdb-big')});
    if(!big)c.classList.add('vmdb-big');
  }});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')cs.forEach(function(x){x.classList.remove('vmdb-big')})});
})();
</script>
