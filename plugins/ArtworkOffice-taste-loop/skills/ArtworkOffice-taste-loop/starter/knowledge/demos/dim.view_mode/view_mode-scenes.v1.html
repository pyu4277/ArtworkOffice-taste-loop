<style>
.vmsc-wrap{display:flex;flex-direction:column;height:100%;padding:6px;gap:4px;background:#0b1020;color:#e2e8f0}
.vmsc-stage{position:relative;flex:1;min-height:0;background:#0f172a;border-radius:8px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.vmsc-stage svg{position:absolute;inset:0;width:100%;height:100%;display:none}
.vmsc-stage svg.vmsc-on{display:block}
.vmsc-stage text{fill:#e2e8f0;font:600 11px var(--font)}
.vmsc-chip{position:absolute;left:3%;top:6%;padding:1px 8px;border-radius:999px;background:rgba(167,139,250,.2);color:#ddd6fe;font-weight:700;font-size:10px;z-index:2}
.vmsc-cap{position:absolute;left:4%;right:4%;bottom:6%;text-align:center;font-size:11px;font-weight:600;line-height:1.4;z-index:2}
.vmsc-cap span{background:rgba(0,0,0,.72);padding:1px 6px;border-radius:4px}
.vmsc-bar{position:relative;height:6px;background:#1e293b;border-radius:3px;cursor:pointer;flex:none}
.vmsc-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ef4444;border-radius:3px}
.vmsc-tick{position:absolute;top:0;bottom:0;width:2px;background:#0b1020}
.vmsc-ctl{display:flex;gap:4px;align-items:center;flex:none}
.vmsc-ctl button{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:5px;padding:1px 7px;font-size:10px}
.vmsc-ctl button:hover{background:#334155}
.vmsc-info{margin-left:auto;color:#94a3b8;font-size:10px;padding-right:2px}
.vmsc-grow{transform-box:fill-box;transform-origin:center;animation:vmsc-grow 1.6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes vmsc-grow{from{transform:scale(.25)}to{transform:scale(1)}}
.vmsc-flow{stroke-dasharray:14 10;animation:vmsc-flow .9s linear infinite}
@keyframes vmsc-flow{to{stroke-dashoffset:-24}}
.vmsc-up{transform-box:fill-box;transform-origin:bottom;animation:vmsc-up 1.1s ease both}
@keyframes vmsc-up{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.vmsc-pop{opacity:0;animation:vmsc-pop .6s ease forwards}
@keyframes vmsc-pop{to{opacity:1}}
.vmsc-paused *{animation-play-state:paused!important}
</style>
<div class="vmsc-wrap">
  <div class="vmsc-stage" id="vmsc-stage">
    <div class="vmsc-chip" id="vmsc-chip">1장 원리</div>
    <svg class="vmsc-on" viewBox="0 0 320 170" aria-label="크기 비교 장면">
      <circle cx="105" cy="72" r="15" fill="#3b82f6"/>
      <circle class="vmsc-grow" cx="210" cy="72" r="42" fill="#ef4444" opacity=".9"/>
      <text x="105" y="112" text-anchor="middle">작은 것</text>
      <text x="210" y="132" text-anchor="middle">큰 것</text>
    </svg>
    <svg viewBox="0 0 320 170" aria-label="흐름 장면">
      <rect x="40" y="52" width="60" height="40" rx="8" fill="#1e293b" stroke="#22d3ee"/>
      <rect x="220" y="52" width="60" height="40" rx="8" fill="#1e293b" stroke="#22d3ee"/>
      <text x="70" y="76" text-anchor="middle">시작</text><text x="250" y="76" text-anchor="middle">도착</text>
      <path class="vmsc-flow" d="M104 72 H212" stroke="#facc15" stroke-width="5" fill="none"/>
      <path d="M204 63 L218 72 L204 81 z" fill="#facc15"/>
    </svg>
    <svg viewBox="0 0 320 170" aria-label="막대 비교 장면">
      <line x1="70" y1="118" x2="260" y2="118" stroke="#334155" stroke-width="2"/>
      <rect class="vmsc-up" x="88" y="78" width="30" height="40" rx="3" fill="#a78bfa"/>
      <rect class="vmsc-up" x="146" y="52" width="30" height="66" rx="3" fill="#34d399" style="animation-delay:.25s"/>
      <rect class="vmsc-up" x="204" y="30" width="30" height="88" rx="3" fill="#f59e0b" style="animation-delay:.5s"/>
      <text class="vmsc-pop" x="219" y="24" text-anchor="middle" style="animation-delay:1.3s">가장 큼</text>
    </svg>
    <div class="vmsc-cap" id="vmsc-cap"><span>먼저 두 크기를 나란히 놓고 비교해 봅니다</span></div>
  </div>
  <div class="vmsc-bar" id="vmsc-bar" title="눌러서 그 장면으로"><div class="vmsc-fill" id="vmsc-fill"></div><div class="vmsc-tick" style="left:33.3%"></div><div class="vmsc-tick" style="left:66.6%"></div></div>
  <div class="vmsc-ctl">
    <button id="vmsc-prev" aria-label="이전 장면">⏮ 이전</button>
    <button id="vmsc-play" aria-label="재생/일시정지">⏸ 일시정지</button>
    <button id="vmsc-next" aria-label="다음 장면">다음 ⏭</button>
    <span class="vmsc-info" id="vmsc-info">1 / 3</span>
  </div>
</div>
<span class="hint-chip" style="top:8px;bottom:auto">눌러 보세요</span>
<script>
(function(){
  var S=[['1장 원리','먼저 두 크기를 나란히 놓고 비교해 봅니다'],['2장 흐름','화살표가 움직이며 흐르는 방향을 알려 줍니다'],['정리','막대가 자라며 차이를 한눈에 보여 줍니다']];
  var D=3200,i=0,t=0,play=true,last=Date.now();
  var g=function(id){return document.getElementById(id)};
  var st=g('vmsc-stage'),svgs=st.querySelectorAll('svg'),chip=g('vmsc-chip'),cap=g('vmsc-cap').firstChild,fill=g('vmsc-fill'),info=g('vmsc-info'),pb=g('vmsc-play');
  function draw(){fill.style.width=((i+Math.min(t/D,1))/S.length*100)+'%'}
  function show(n){
    i=(n+S.length)%S.length;t=0;
    for(var k=0;k<svgs.length;k++)svgs[k].classList.toggle('vmsc-on',k===i);
    chip.textContent=S[i][0];cap.textContent=S[i][1];info.textContent=(i+1)+' / '+S.length;draw();
  }
  function setPlay(p){play=p;pb.textContent=p?'⏸ 일시정지':'▶ 재생';st.classList.toggle('vmsc-paused',!p)}
  setInterval(function(){var now=Date.now(),dt=now-last;last=now;if(!play)return;t+=dt;if(t>=D)show(i+1);else draw()},100);
  g('vmsc-prev').onclick=function(){show(i-1)};
  g('vmsc-next').onclick=function(){show(i+1)};
  pb.onclick=function(){setPlay(!play)};
  g('vmsc-bar').onclick=function(e){var r=this.getBoundingClientRect();if(r.width)show(Math.floor((e.clientX-r.left)/r.width*S.length))};
  document.addEventListener('keydown',function(e){
    if(e.key===' '){e.preventDefault();setPlay(!play)}else if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);
  });
})();
</script>
