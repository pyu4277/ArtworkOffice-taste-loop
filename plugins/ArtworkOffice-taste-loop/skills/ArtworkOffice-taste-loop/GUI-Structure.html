<script>
const SPEC = __SPEC__;
(function(){
'use strict';
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
const KEY = 'pe-edit:' + (SPEC.spec_id || 'spec');
const BASE = {dims: clone(SPEC.dimensions || {screens: [], dimensions: []}), qs: clone(SPEC.questions || {categories: [], aspects: [], project_questions: []})};
const PENDING = Array.isArray(SPEC.pending_ops) ? SPEC.pending_ops : [];
const T_NAME = {screen: '목차', dim: '질문', value: '선택지', cat: '취향 묶음', sub: '하위 묶음', aspect: '취향 질문', option: '취향 선택지', pq: '3부 질문', pqopt: '3부 선택지'};
const F_NAME = {title: '이름', name: '이름', label: '이름', text: '질문 글', desc: '설명', type: '유형', when: '보이는 조건', free: '직접 입력 칸', group: '묶음 제목', retired: '빼기'};
const FIELDS = {screen: ['title', 'when', 'retired'], dim: ['name', 'desc', 'type', 'when', 'retired'], value: ['label', 'when', 'free', 'group', 'retired'],
  cat: ['name', 'when', 'retired'], sub: ['name'], aspect: ['text', 'type', 'when', 'retired'], option: ['label', 'when', 'group', 'retired'],
  pq: ['text', 'type', 'when', 'retired'], pqopt: ['label', 'when', 'group', 'retired']};
const LEGACY = ['ask_when', 'ask_strict', 'applies_when'];
const TYPE_NAME = {single: '하나 고르기', multi: '여러 개 고르기', text: '글로 쓰기', scale: '척도', rank: '순서', approve: '승인', compare: '비교'};

// ---------- 편집 기록 적용 (scripts/structure.py 와 같은 규칙) ----------
class EditError extends Error {}
const find = (lst, i) => (lst || []).find(x => x && x.id === i) || null;
const nameOf = (t, i) => `${T_NAME[t] || t} '${i}'`;
function locate(m, node) {
  const t = node.t, i = node.id, D = m.dims, Q = m.qs;
  let lst;
  if (t === 'screen') lst = D.screens = D.screens || [];
  else if (t === 'dim') lst = D.dimensions = D.dimensions || [];
  else if (t === 'value') { const d = find(D.dimensions, node.dim); if (!d) throw new EditError(`질문 '${node.dim}' 없음`); lst = d.values = d.values || []; }
  else if (t === 'cat') lst = Q.categories = Q.categories || [];
  else if (t === 'sub') {
    const c = find(Q.categories, node.cat); if (!c) throw new EditError(`취향 묶음 '${node.cat}' 없음`);
    c.subs = c.subs || {};
    if (!(i in c.subs)) throw new EditError(`하위 묶음 '${i}' 없음`);
    return [c.subs, c];
  }
  else if (t === 'aspect') lst = Q.aspects = Q.aspects || [];
  else if (t === 'option') { const a = find(Q.aspects, node.aspect); if (!a) throw new EditError(`취향 질문 '${node.aspect}' 없음`); lst = a.options = a.options || []; }
  else if (t === 'pq') lst = Q.project_questions = Q.project_questions || [];
  else if (t === 'pqopt') { const q = find(Q.project_questions, node.pq); if (!q) throw new EditError(`3부 질문 '${node.pq}' 없음`); lst = q.options = q.options || []; }
  else throw new EditError(`모르는 항목 종류 '${t}'`);
  const x = find(lst, i);
  if (!x) throw new EditError(nameOf(t, i) + ' 없음');
  return [x, lst];
}
function listOf(m, node) {
  const t = node.t, D = m.dims, Q = m.qs;
  if (t === 'screen') return D.screens = D.screens || [];
  if (t === 'dim') return D.dimensions = D.dimensions || [];
  if (t === 'value') { const d = find(D.dimensions, node.dim); if (!d) throw new EditError(`질문 '${node.dim}' 없음`); return d.values = d.values || []; }
  if (t === 'cat') return Q.categories = Q.categories || [];
  if (t === 'aspect') return Q.aspects = Q.aspects || [];
  if (t === 'option') { const a = find(Q.aspects, node.aspect); if (!a) throw new EditError(`취향 질문 '${node.aspect}' 없음`); return a.options = a.options || []; }
  if (t === 'pq') return Q.project_questions = Q.project_questions || [];
  if (t === 'pqopt') { const q = find(Q.project_questions, node.pq); if (!q) throw new EditError(`3부 질문 '${node.pq}' 없음`); return q.options = q.options || []; }
  throw new EditError(`모르는 항목 종류 '${t}'`);
}
function ins(lst, x, index) { if (index == null || index < 0 || index > lst.length) lst.push(x); else lst.splice(index, 0, x); }
function subCat(m, sub) { return (m.qs.categories || []).find(c => c.subs && Object.prototype.hasOwnProperty.call(c.subs, sub)) || null; }
const insPos = (len, idx) => idx == null ? len : Math.max(0, Math.min(idx, len));
function aspectPlace(m, aid, sub, index) {
  const A = m.qs.aspects;
  const a = find(A, aid);
  A.splice(A.indexOf(a), 1);
  a.sub = sub;
  const same = A.filter(x => x.sub === sub);
  if (!same.length) {
    const c = subCat(m, sub);
    const order = Object.keys((c || {}).subs || {});
    let pos = A.length;
    if (order.includes(sub)) {
      const before = order.slice(0, order.indexOf(sub));
      const idxs = []; A.forEach((x, k) => { if (before.includes(x.sub)) idxs.push(k); });
      if (idxs.length) pos = idxs[idxs.length - 1] + 1;
      else {
        const catIdxs = []; A.forEach((x, k) => { if (c && String(x.sub || '').startsWith(c.id + '.')) catIdxs.push(k); });
        pos = catIdxs.length ? catIdxs[0] : A.length;
      }
    }
    A.splice(pos, 0, a);
    return;
  }
  if (index == null || index >= same.length) A.splice(A.indexOf(same[same.length - 1]) + 1, 0, a);
  else A.splice(A.indexOf(same[Math.max(0, index)]), 0, a);
}
const isEmptyAfter = v => v === undefined || v === null || v === '' || v === false || (Array.isArray(v) && !v.length);
function applyOp(m, op) {
  const kind = op.op, node = op.node || {}, t = node.t;
  if (kind === 'set') {
    const f = op.field;
    if (!(FIELDS[t] || []).includes(f)) throw new EditError(`${T_NAME[t] || t}의 '${f}' 칸은 바꿀 수 없음`);
    if (t === 'sub') {
      const [subs] = locate(m, node);
      if (op.after == null || op.after === '') throw new EditError('하위 묶음 이름은 비울 수 없음');
      subs[node.id] = op.after;
      return;
    }
    const [x] = locate(m, node);
    if (isEmptyAfter(op.after)) delete x[f]; else x[f] = clone(op.after);
    if (f === 'when') for (const k of LEGACY) delete x[k];
    return;
  }
  if (kind === 'add') {
    const data = clone(op.data || {}) || {};
    // 새 id 는 node.id(편집기가 내보내는 곳). 손으로 쓴 기록이 data.id 에만 두었으면 그것을 쓴다 — scripts/structure.py 와 같은 규칙
    if (node.id && data.id && node.id !== data.id) throw new EditError(`새 항목의 id 가 두 곳에서 다름(node.id '${node.id}' ≠ data.id '${data.id}') — 한 값으로 맞추세요`);
    data.id = node.id || data.id;
    if (!data.id) throw new EditError('새 항목에 id 가 없음 — 새 id 는 node 안에 넣는다(예: {"op": "add", "node": {"t": "option", "aspect": "P2.4.density", "id": "medium"}, "data": {"label": "…"}})');
    if (t === 'sub') {
      const c = find(m.qs.categories, node.cat); if (!c) throw new EditError(`취향 묶음 '${node.cat}' 없음`);
      c.subs = c.subs || {};
      if (data.id in c.subs) throw new EditError(`하위 묶음 '${data.id}' 이미 있음`);
      const items = Object.entries(c.subs);
      items.splice(insPos(items.length, op.index), 0, [data.id, data.name || data.id]);
      c.subs = Object.fromEntries(items);
      return;
    }
    const lst = listOf(m, node);
    if (find(lst, data.id)) throw new EditError(`${T_NAME[t] || t} '${data.id}' 이미 있음`);
    if (t === 'screen') { if (!('dimensions' in data)) data.dimensions = []; ins(lst, data, op.index); }
    else if (t === 'dim') {
      const scr = find(m.dims.screens, op.parent); if (!scr) throw new EditError(`목차 '${op.parent}' 없음`);
      if (!('type' in data)) data.type = 'single';
      if (data.type !== 'text' && !('values' in data)) data.values = [];
      lst.push(data);
      ins(scr.dimensions = scr.dimensions || [], data.id, op.index);
    } else if (t === 'aspect') {
      const sub = op.parent || data.sub;
      if (!subCat(m, sub)) throw new EditError(`하위 묶음 '${sub}' 없음`);
      if (!String(data.id).startsWith(sub + '.')) throw new EditError(`취향 질문 id 는 하위 묶음 이름으로 시작해야 함(${sub}.…)`);
      if (!('type' in data)) data.type = 'single';
      if ((data.type === 'single' || data.type === 'multi') && !('options' in data)) data.options = [];
      lst.push(data);
      aspectPlace(m, data.id, sub, op.index);
    } else if (t === 'cat') { if (!('subs' in data)) data.subs = {}; ins(lst, data, op.index); }
    else ins(lst, data, op.index);
    return;
  }
  if (kind === 'move') {
    const idx = op.index;
    if (t === 'sub') {
      const [subs, c] = locate(m, node);
      const items = Object.entries(subs).filter(([k]) => k !== node.id);
      items.splice(insPos(items.length, idx), 0, [node.id, subs[node.id]]);
      c.subs = Object.fromEntries(items);
      return;
    }
    const [x, lst] = locate(m, node);
    if (t === 'dim') {
      const scrs = m.dims.screens || [];
      const src = scrs.find(s => (s.dimensions || []).includes(x.id)) || null;
      const dst = op.parent ? find(scrs, op.parent) : src;
      if (!dst) throw new EditError(`목차 '${op.parent}' 없음`);
      if (src) src.dimensions.splice(src.dimensions.indexOf(x.id), 1);
      ins(dst.dimensions = dst.dimensions || [], x.id, idx);
      return;
    }
    if (t === 'aspect') {
      const sub = op.parent || x.sub;
      if (sub !== x.sub) throw new EditError(`취향 질문은 다른 하위 묶음으로 옮길 수 없음(${x.sub} → ${sub}) — 새 질문을 만들고 옛 질문은 빼기`);
      aspectPlace(m, x.id, sub, idx);
      return;
    }
    lst.splice(lst.indexOf(x), 1);
    ins(lst, x, idx);
    return;
  }
  throw new EditError(`모르는 편집 '${kind}'`);
}
function replay(base, ops) { // → {m, problems:[{k, op, msg}]}
  const m = {dims: clone(base.dims), qs: clone(base.qs)};
  const problems = [];
  (ops || []).forEach((op, k) => { try { applyOp(m, op); } catch (e) { if (!(e instanceof EditError)) throw e; problems.push({k, op, msg: e.message}); } });
  return {m, problems};
}

// ---------- 보이는 조건 (GUI-Interview.html · structure.py 와 같은 판정) ----------
let pv = {}; // 미리보기 답
function projectValue(key) { const v = pv[key]; if (v == null || v === '' || (Array.isArray(v) && !v.length)) return null; return Array.isArray(v) ? v : [v]; }
function conditionOk(cond, strict) {
  for (const [k, vs] of Object.entries(cond || {})) {
    const p = projectValue(k);
    if (!p) { if (strict) return false; continue; }
    if (!vs.some(v => p.includes(v))) return false;
  }
  return true;
}
const condAny = (c, strict) => !c || (Array.isArray(c) ? (!c.length || c.some(x => conditionOk(x, strict))) : conditionOk(c, strict));
const whenOk = x => !!x && !x.retired && (!x.ask_when || condAny(x.ask_when, !!x.ask_strict)) && (!x.applies_when || condAny(x.applies_when, false)) && (!x.when || condAny(x.when, true));
const visOpts = list => (list || []).filter(whenOk);
const scrOfDim = id => (model.dims.screens || []).find(s => (s.dimensions || []).includes(id)) || null; // 목차의 조건이 안 맞으면 그 안의 질문도 숨는다
const dimShown = d => whenOk(d) && (!scrOfDim(d.id) || whenOk(scrOfDim(d.id))) && (d.type === 'text' || !(d.values || []).length || visOpts(d.values).length > 0);
const aspShown = a => whenOk(a) && (a.type === 'text' || a.type === 'scale' || !(a.options || []).length || visOpts(a.options).length > 0);
const condOf = x => x ? (x.when || x.ask_when || x.applies_when || null) : null;
function condText(c, m) {
  if (!c) return '';
  if (Array.isArray(c)) return c.map(x => condText(x, m)).join(' 또는 ');
  const dims = (m || model).dims.dimensions || [];
  return Object.entries(c).map(([k, vs]) => {
    const d = dims.find(x => x.id === k);
    const lab = v => { const o = d && (d.values || []).find(x => x.id === v); return o ? o.label : v; };
    return `「${d ? d.name : k}」에서 ${vs.map(lab).join('·')}`;
  }).join(' 그리고 ');
}

// ---------- 상태 ----------
let ops = [];
